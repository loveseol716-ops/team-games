<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PLAYER · TEAM GAMES</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="athlete.css">
</head>
<body>
<div id="nav"></div>
<main>
  <section class="player-hero">
    <div class="container">
      <div class="arcade-eyebrow">PLAYER MODE // GAME #01</div>
      <h1>ENTER<br>THE GAME.</h1>
      <p class="lead">계정을 만들고 PLAYER CARD를 완성한 뒤, 이번 GAME의 파트너를 고릅니다.</p>
    </div>
  </section>
  <section class="section"><div class="container"><div id="authView" class="player-auth"></div><div id="onboardView" style="display:none"></div><div id="hubView" style="display:none"></div></div></section>
</main>
<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
shell('PLAYER');
let user=null,me=null,currentEvent=null,allPlayers=[],myInvites=[],myTeam=null,myRoster=[],myStats=null,myHistory=[];

function friendly(e){
  const m=String(e?.message||e||'');
  if(m.includes('EMAIL_EXISTS')||m.toLowerCase().includes('already registered'))return '이미 가입된 이메일입니다. PLAYER LOGIN을 이용해 주세요.';
  if(m.includes('INVALID_EMAIL'))return '이메일 주소를 다시 확인해 주세요.';
  if(m.includes('INVALID_PASSWORD'))return '비밀번호는 8자 이상으로 설정해 주세요.';
  if(m.includes('Invalid login credentials'))return '이메일 또는 비밀번호가 맞지 않습니다.';
  if(m.includes('tg_athletes_handle_uidx')||e?.code==='23505')return '이미 사용 중인 PLAYER ID입니다.';
  if(m.includes('ATHLETE_ALREADY_LOCKED_IN'))return '둘 중 한 명이 이미 이번 GAME에 팀이 확정되어 있습니다.';
  if(m.includes('REGISTRATION_FULL'))return 'GAME #01 참가팀이 모두 찼습니다.';
  if(m.includes('REGISTRATION_CLOSED'))return '현재 GAME #01 참가 신청이 닫혀 있습니다.';
  if(m.includes('INVITE_NOT_PENDING'))return '이미 처리된 초대입니다.';
  return m||'처리 중 오류가 발생했습니다.';
}

function showAuth(mode='login',message=''){
  authView.style.display='block';onboardView.style.display='none';hubView.style.display='none';
  authView.innerHTML=`<div class="card">
    <div class="player-auth-tabs"><button id="loginTab" class="btn ${mode==='login'?'active':'dark'}" type="button">PLAYER LOGIN</button><button id="signupTab" class="btn ${mode==='signup'?'active':'dark'}" type="button">CREATE ACCOUNT</button></div>
    <div class="kicker">${mode==='login'?'PLAYER LOGIN':'NEW PLAYER'}</div>
    <h3>${mode==='login'?'WELCOME BACK.':'MAKE YOUR ACCOUNT.'}</h3>
    <p class="muted">${mode==='login'?'이메일과 비밀번호로 로그인합니다.':'이메일 인증 없이 바로 계정을 만들고 PLAYER CARD 작성으로 넘어갑니다.'}</p>
    <form id="authForm" class="player-form">
      <div class="full"><label>Email</label><input id="authEmail" type="email" autocomplete="email" required></div>
      <div class="full"><label>Password</label><input id="authPassword" type="password" minlength="8" maxlength="72" autocomplete="${mode==='login'?'current-password':'new-password'}" required></div>
      <div class="full"><button id="authSubmit" class="btn arcade-primary" type="submit">${mode==='login'?'LOGIN':'CREATE & START'}</button><div id="authMsg" class="notice" ${message?'style="display:block"':''}>${esc(message)}</div></div>
    </form>
  </div>`;
  loginTab.onclick=()=>showAuth('login'); signupTab.onclick=()=>showAuth('signup');
  authForm.onsubmit=async e=>{
    e.preventDefault();authSubmit.disabled=true;authSubmit.textContent=mode==='login'?'LOGGING IN…':'CREATING…';
    try{
      const email=authEmail.value.trim().toLowerCase(),password=authPassword.value;
      if(mode==='signup'){
        const r=await db.functions.invoke('tg-athlete-signup',{body:{email,password}});
        if(r.error)throw r.error;
        if(!r.data?.ok)throw new Error(r.data?.error||'SIGNUP_FAILED');
      }
      const login=await db.auth.signInWithPassword({email,password});
      if(login.error)throw login.error;
      await boot();
    }catch(x){notice('authMsg',friendly(x),true)}finally{if(document.getElementById('authSubmit')){authSubmit.disabled=false;authSubmit.textContent=mode==='login'?'LOGIN':'CREATE & START'}}
  };
}

function showOnboarding(){
  authView.style.display='none';hubView.style.display='none';onboardView.style.display='block';
  onboardView.innerHTML=`<div class="sectionhead"><div><div class="kicker">STEP 2</div><h2>MAKE YOUR PLAYER CARD.</h2></div><button id="logoutSetup" class="btn dark">LOGOUT</button></div>
  <form id="profileForm" class="card player-form">
    <div><label>Player Name</label><input id="displayName" maxlength="50" placeholder="JAY SEOL" required></div>
    <div><label>Player ID</label><input id="handle" maxlength="24" pattern="[A-Za-z0-9._-]{2,24}" placeholder="jay.seol" required></div>
    <div><label>Gender</label><select id="gender"><option value="male">MALE</option><option value="female">FEMALE</option></select></div>
    <div><label>Division</label><select id="division"><option>OPEN</option><option>PRO</option></select></div>
    <div><label>Gym / Crew</label><input id="gym" maxlength="60" placeholder="NOLTO GYM"></div>
    <div><label>Instagram</label><input id="instagram" maxlength="40" placeholder="@handle"></div>
    <div class="full"><label>Phone</label><input id="phone" inputmode="tel" placeholder="010-0000-0000" required></div>
    <div class="full"><label>Player Photo</label><input id="playerPhoto" type="file" accept="image/jpeg,image/png,image/webp" required><div class="hint">GAME #01의 팀 라인업과 FAN PICK에 공개됩니다. 최대 5MB.</div></div>
    <div class="full"><label style="display:flex;gap:8px;align-items:flex-start"><input id="consent" type="checkbox" style="width:auto;margin-top:3px" required><span>TEAM GAMES 참가 운영을 위한 이름·연락처·사진 수집 및 선수 카드 공개에 동의합니다.</span></label></div>
    <div class="full"><button id="saveProfileBtn" class="btn arcade-primary" type="submit">SAVE PLAYER CARD</button><div id="profileMsg" class="notice"></div></div>
  </form>`;
  logoutSetup.onclick=logout; profileForm.onsubmit=saveProfile;
}

async function saveProfile(e){
  e.preventDefault();saveProfileBtn.disabled=true;saveProfileBtn.textContent='SAVING…';
  try{
    const file=playerPhoto.files[0];if(!file)throw new Error('PLAYER PHOTO REQUIRED');
    if(file.size>5*1024*1024)throw new Error('사진은 5MB 이하로 업로드해 주세요.');
    if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('JPG, PNG, WEBP만 업로드할 수 있습니다.');
    const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=`${user.id}/profile.${ext}`;
    const up=await db.storage.from('tg-athlete-photos').upload(path,file,{upsert:true,contentType:file.type});if(up.error)throw up.error;
    const photo_url=db.storage.from('tg-athlete-photos').getPublicUrl(path).data.publicUrl+`?v=${Date.now()}`;
    const a=await db.from('tg_athletes').upsert({id:user.id,display_name:displayName.value.trim(),handle:handle.value.trim(),photo_url,gender:gender.value,division:division.value,gym:gym.value.trim()||null,instagram:instagram.value.trim()||null,profile_public:true},{onConflict:'id'});if(a.error)throw a.error;
    const p=await db.from('tg_athlete_private').upsert({athlete_id:user.id,phone:phone.value.trim(),privacy_consent_at:new Date().toISOString()},{onConflict:'athlete_id'});if(p.error)throw p.error;
    await boot();
  }catch(x){notice('profileMsg',friendly(x),true)}finally{if(document.getElementById('saveProfileBtn')){saveProfileBtn.disabled=false;saveProfileBtn.textContent='SAVE PLAYER CARD'}}
}

async function loadHub(){
  currentEvent=await event();
  const [aq,sq,hq,iq,mq,pq]=await Promise.all([
    db.from('tg_athletes').select('*').eq('id',user.id).maybeSingle(),
    db.rpc('tg_my_stats',{p_season_slug:'season-2026'}),
    db.rpc('tg_my_history'),
    db.from('tg_team_invites').select('*').eq('event_id',currentEvent.id).order('created_at',{ascending:false}),
    db.from('tg_team_members').select('team_id,athlete_id,member_role').eq('event_id',currentEvent.id).eq('athlete_id',user.id).eq('active',true),
    db.from('tg_athletes').select('id,display_name,handle,photo_url,gym,gender,division').eq('profile_public',true).order('display_name')
  ]);
  for(const q of [aq,sq,hq,iq,mq,pq])if(q.error)throw q.error;
  me=aq.data;myStats=sq.data?.[0]||{leaderboard_rank:'—',total_points:0,starts:0,wins:0,podiums:0};myHistory=hq.data||[];myInvites=iq.data||[];allPlayers=(pq.data||[]).filter(x=>x.id!==user.id);myTeam=null;myRoster=[];
  if(mq.data?.length){
    const teamId=mq.data[0].team_id;
    const [tq,rq]=await Promise.all([db.from('tg_teams').select('id,team_name,heat_no,station_no,status').eq('id',teamId).single(),db.from('tg_team_members').select('athlete_id,member_role').eq('team_id',teamId).eq('active',true)]);
    if(tq.error)throw tq.error;if(rq.error)throw rq.error;myTeam=tq.data;
    const ids=(rq.data||[]).map(x=>x.athlete_id);if(ids.length){const people=await db.from('tg_athletes').select('id,display_name,handle,photo_url').in('id',ids);if(people.error)throw people.error;myRoster=people.data||[]}
  }
}

function renderHub(){
  authView.style.display='none';onboardView.style.display='none';hubView.style.display='block';
  hubView.innerHTML=`<div class="sectionhead"><div><div class="kicker">PLAYER HUB // PRIVATE</div><h2>${esc(me.display_name)}</h2></div><div class="row-actions"><a class="btn dark" href="player.html?id=${encodeURIComponent(me.id)}">GAME #01 CARD</a><button id="logoutBtn" class="btn dark">LOGOUT</button></div></div>
  <div class="player-grid">
    <div>
      <div class="player-card"><div class="player-card-photo"><img src="${esc(me.photo_url)}" alt="${esc(me.display_name)}"></div><div class="player-card-body"><div class="player-card-rank">PRIVATE PLAYER DATA</div><div class="player-card-name">${esc(me.display_name)}</div><div class="player-card-handle">@${esc(me.handle)}</div><div class="player-card-meta"><span class="player-chip">${esc(me.gender.toUpperCase())}</span><span class="player-chip">${esc(me.division)}</span>${me.gym?`<span class="player-chip">${esc(me.gym)}</span>`:''}</div><div class="player-stats"><div class="player-stat"><span>MY RANK</span><strong>#${myStats.leaderboard_rank}</strong></div><div class="player-stat"><span>PTS</span><strong>${myStats.total_points}</strong></div><div class="player-stat"><span>STARTS</span><strong>${myStats.starts}</strong></div><div class="player-stat"><span>PODIUMS</span><strong>${myStats.podiums}</strong></div></div></div></div>
    </div>
    <div id="gameHub"></div>
  </div>
  <section class="admin-block" style="margin-top:32px"><div class="sectionhead"><div><div class="kicker">PRIVATE RECORD</div><h2>MY GAME LOG</h2></div><p>본인에게만 표시됩니다.</p></div><div class="history-list" id="historyList"></div></section>`;
  logoutBtn.onclick=logout;renderGameHub();renderHistory();
}

function renderHistory(){
  historyList.innerHTML=myHistory.length?myHistory.map(x=>`<div class="history-row"><div class="mini-avatar"><div class="fallback" style="height:100%;display:grid;place-items:center;color:#777">#${x.place}</div></div><div><div class="row-title">${esc(x.event_title)} · ${esc(x.team_name)}</div><div class="row-sub">WITH ${esc(x.partner_name||'—')} · ${new Date(x.event_date).toLocaleDateString('ko-KR')}</div></div><div class="row-actions"><span class="player-chip">#${x.place}</span><span class="player-chip">${x.points} PTS</span></div></div>`).join(''):'<div class="card muted">아직 공식 경기 기록이 없습니다.</div>';
}

function person(id){return allPlayers.find(x=>x.id===id)||null}
function inviteRow(inv,incoming){
  const p=person(incoming?inv.captain_id:inv.invitee_id);
  return `<div class="invite-row"><div class="mini-avatar">${p?.photo_url?`<img src="${esc(p.photo_url)}" alt="">`:''}</div><div><div class="row-title">${esc(inv.team_name)}</div><div class="row-sub">${esc(p?.display_name||'PLAYER')} · @${esc(p?.handle||'')}</div></div><div class="row-actions">${incoming?`<button class="mini-btn hot" onclick="respondInvite('${inv.id}',true)">ACCEPT</button><button class="mini-btn" onclick="respondInvite('${inv.id}',false)">DECLINE</button>`:`<button class="mini-btn" onclick="cancelInvite('${inv.id}')">CANCEL</button>`}</div></div>`;
}

function renderGameHub(){
  if(myTeam){
    const mate=myRoster.find(x=>x.id!==user.id);
    gameHub.innerHTML=`<div class="team-lock"><div class="kicker">GAME #01 // LOCKED IN</div><div class="team-lock-top"><div><h3>${esc(myTeam.team_name)}</h3><p class="muted">${esc(me.display_name)} × ${esc(mate?.display_name||'PARTNER')}</p></div><div class="slot-display">H${myTeam.heat_no} · S${myTeam.station_no}</div></div></div>`;return;
  }
  const incoming=myInvites.filter(x=>x.invitee_id===user.id&&x.status==='pending');const outgoing=myInvites.filter(x=>x.captain_id===user.id&&x.status==='pending');
  gameHub.innerHTML=`<div class="player-panel"><div class="kicker">GAME #01</div><h3>CHOOSE YOUR PARTNER.</h3><p class="muted">한 명이 팀 이름을 정하고 다른 PLAYER에게 초대합니다. 상대가 ACCEPT하면 참가가 확정됩니다.</p><div style="margin-top:18px"><label>Team Name</label><input id="teamNameInput" maxlength="60" placeholder="YOUR TEAM NAME"><label style="margin-top:12px">Find Player</label><input id="playerSearch" type="search" placeholder="이름 / PLAYER ID / GYM"><div id="playerSearchList" class="player-search-list" style="margin-top:10px"></div></div></div><div class="player-panel" style="margin-top:14px"><div class="kicker">INCOMING</div><h3>INVITES</h3><div class="invite-list" id="incomingList"></div></div><div class="player-panel" style="margin-top:14px"><div class="kicker">OUTGOING</div><h3>YOUR INVITE</h3><div class="invite-list" id="outgoingList"></div></div>`;
  playerSearch.oninput=renderPlayerSearch;renderPlayerSearch();incomingList.innerHTML=incoming.map(x=>inviteRow(x,true)).join('')||'<div class="muted">NO INVITES.</div>';outgoingList.innerHTML=outgoing.map(x=>inviteRow(x,false)).join('')||'<div class="muted">NO PENDING INVITE.</div>';
}

function renderPlayerSearch(){
  const q=(playerSearch.value||'').trim().toLowerCase();const list=allPlayers.filter(p=>!q||[p.display_name,p.handle,p.gym].some(v=>String(v||'').toLowerCase().includes(q))).slice(0,8);
  playerSearchList.innerHTML=list.map(p=>`<div class="player-search-row"><div class="mini-avatar"><img src="${esc(p.photo_url)}" alt=""></div><div><div class="row-title">${esc(p.display_name)}</div><div class="row-sub">@${esc(p.handle)}${p.gym?` · ${esc(p.gym)}`:''}</div></div><div class="row-actions"><button class="mini-btn hot" onclick="sendInvite('${p.id}')">INVITE</button></div></div>`).join('')||'<div class="muted">PLAYER NOT FOUND.</div>';
}

window.sendInvite=async id=>{try{const name=teamNameInput.value.trim();if(!name)throw new Error('팀 이름을 먼저 입력해 주세요.');const r=await db.rpc('tg_send_team_invite',{p_event_slug:C.eventSlug,p_invitee_id:id,p_team_name:name});if(r.error)throw r.error;await loadHub();renderHub()}catch(e){alert(friendly(e))}};
window.respondInvite=async(id,accept)=>{try{const r=await db.rpc('tg_respond_team_invite',{p_invite_id:id,p_accept:accept});if(r.error)throw r.error;await loadHub();renderHub()}catch(e){alert(friendly(e))}};
window.cancelInvite=async id=>{try{const r=await db.rpc('tg_cancel_team_invite',{p_invite_id:id});if(r.error)throw r.error;await loadHub();renderHub()}catch(e){alert(friendly(e))}};

async function logout(){await db.auth.signOut();user=null;me=null;showAuth('login')}
async function boot(){
  const {data:{user:u}}=await db.auth.getUser();user=u||null;
  if(!user){showAuth('login');return}
  const q=await db.from('tg_athletes').select('id').eq('id',user.id).maybeSingle();if(q.error)throw q.error;
  if(!q.data){showOnboarding();return}
  await loadHub();renderHub();
}

boot().catch(e=>showAuth('login',friendly(e)));
</script>
</body>
</html>
