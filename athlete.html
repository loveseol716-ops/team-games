<main>

    <div class="container">

        <span><b>01</b> ACCOUNT</span><i>→</i><span><b>02</b> PLAYER CARD</span><i>→</i><span><b>03</b> TEAM BUILD</span><i>→</i><span><b>04</b> PAYMENT</span><i>→</i><span><b>05</b> LOCKED IN</span>

<script>
shell('PLAYER');
const joinIntent=new URLSearchParams(location.search).get('join')==='1';
const BANK_NAME='기업은행';
const BANK_ACCOUNT='244-105758-04-010';
const BANK_HOLDER='버드컴퍼니 유한회사';
let user=null,me=null,privateData=null,currentEvent=null,allPlayers=[],myInvites=[],myTeam=null,myRoster=[],myStats=null,myHistory=[],capacityRows=[],paymentPoll=null;

function friendly(e){
  const m=String(e?.message||e||'');
  if(m.includes('EMAIL_EXISTS')||m.toLowerCase().includes('already registered'))return '이미 가입된 이메일입니다. PLAYER LOGIN을 이용해 주세요.';
  if(m.includes('INVALID_EMAIL'))return '이메일 주소를 다시 확인해 주세요.';
  if(m.includes('INVALID_PASSWORD'))return '비밀번호는 8자 이상으로 설정해 주세요.';
  if(m.includes('Invalid login credentials'))return '이메일 또는 비밀번호가 맞지 않습니다.';
  if(m.includes('tg_athletes_handle_uidx')||e?.code==='23505')return '이미 사용 중인 PLAYER ID입니다.';
  if(m.includes('ATHLETE_ALREADY_LOCKED_IN'))return '둘 중 한 명이 이미 이번 GAME에 참가 진행 중이거나 확정되어 있습니다.';
  if(m.includes('CATEGORY_FULL'))return '선택한 디비전의 해당 팀 구성이 모두 찼습니다.';
  if(m.includes('REGISTRATION_FULL'))return 'GAME #01 참가팀이 모두 찼습니다.';
  if(m.includes('REGISTRATION_CLOSED'))return '현재 GAME #01 참가 신청이 닫혀 있습니다.';
  if(m.includes('INVITE_NOT_PENDING'))return '이미 처리된 초대입니다.';
  if(m.includes('INVALID_DIVISION'))return 'BEGINNER 또는 ATHLETE를 선택해 주세요.';
  if(m.includes('PAYMENT_HOLD_EXPIRED'))return '24시간 입금 대기 시간이 만료되었습니다. 자리 다시 잡기를 눌러 주세요.';
  if(m.includes('DEPOSITOR_NAME_REQUIRED'))return '입금자명을 입력해 주세요.';
  if(m.includes('PAYMENT_NOT_PENDING'))return '현재 입금 대기 상태가 아닙니다.';
  return m||'처리 중 오류가 발생했습니다.';
}

function showAuth(mode='login',message=''){
  authView.style.display='block';onboardView.style.display='none';hubView.style.display='none';
  authView.innerHTML=`<div class="card player-auth-card">
    <div class="entry-status-line"><span>${mode==='signup'?'STEP 01 / 05':'PLAYER ACCESS'}</span><b>${mode==='signup'?'CREATE ACCOUNT':'LOGIN'}</b></div>
    <div class="player-auth-tabs"><button id="loginTab" class="btn ${mode==='login'?'active':'dark'}" type="button">PLAYER LOGIN</button><button id="signupTab" class="btn ${mode==='signup'?'active':'dark'}" type="button">CREATE ACCOUNT</button></div>
    <div class="kicker">${mode==='login'?'PLAYER LOGIN':'GAME #01 ENTRY'}</div>
    <h3>${mode==='login'?'WELCOME BACK.':'START YOUR ENTRY.'}</h3>
    <p class="muted">${mode==='login'?'로그인하면 바로 GAME #01 참가 상태로 이동합니다.':'이메일과 비밀번호만 만들면 바로 PLAYER CARD 작성으로 넘어갑니다.'}</p>
    <form id="authForm" class="player-form">
      <div class="full"><label>Email</label><input id="authEmail" type="email" autocomplete="email" required></div>
      <div class="full"><label>Password</label><input id="authPassword" type="password" minlength="8" maxlength="72" autocomplete="${mode==='login'?'current-password':'new-password'}" required></div>
      <div class="full"><button id="authSubmit" class="btn arcade-primary entry-wide-btn" type="submit">${mode==='login'?'LOGIN & CONTINUE':'CREATE & CONTINUE'}</button><div id="authMsg" class="notice" ${message?'style="display:block"':''}>${esc(message)}</div></div>
    </form>
  </div>`;
  loginTab.onclick=()=>showAuth('login'); signupTab.onclick=()=>showAuth('signup');
  authForm.onsubmit=async e=>{
    e.preventDefault();authSubmit.disabled=true;authSubmit.textContent=mode==='login'?'LOGGING IN…':'CREATING…';
    try{
      const email=authEmail.value.trim().toLowerCase(),password=authPassword.value;
      if(mode==='signup'){
        const r=await db.functions.invoke('tg-athlete-signup',{body:{email,password}});
        if(r.error)throw r.error;
        if(!r.data?.ok)throw new Error(r.data?.error||'SIGNUP_FAILED');
      }
      const login=await db.auth.signInWithPassword({email,password});
      if(login.error)throw login.error;
      await boot();
    }catch(x){notice('authMsg',friendly(x),true)}finally{if(document.getElementById('authSubmit')){authSubmit.disabled=false;authSubmit.textContent=mode==='login'?'LOGIN & CONTINUE':'CREATE & CONTINUE'}}
  };
}

function showOnboarding(){
  authView.style.display='none';hubView.style.display='none';onboardView.style.display='block';
  onboardView.innerHTML=`<div class="sectionhead"><div><div class="kicker">STEP 02 / 05</div><h2>MAKE YOUR PLAYER CARD.</h2></div><button id="logoutSetup" class="btn dark">LOGOUT</button></div>
  <div class="entry-next-note">PLAYER CARD를 저장하면 바로 파트너 선택 화면으로 넘어갑니다.</div>
  <form id="profileForm" class="card player-form">
    <div><label>Player Name</label><input id="displayName" maxlength="50" placeholder="JAY SEOL" required></div>
    <div><label>Player ID</label><input id="handle" maxlength="24" pattern="[A-Za-z0-9._-]{2,24}" placeholder="jay.seol" required></div>
    <div><label>Gender</label><select id="gender"><option value="male">MALE</option><option value="female">FEMALE</option></select></div>
    <div><label>Default Division</label><select id="division"><option value="OPEN">BEGINNER</option><option value="PRO">ATHLETE</option></select><div class="hint">GAME 참가 시 BEGINNER / ATHLETE를 다시 선택할 수 있습니다.</div></div>
    <div><label>Gym / Crew</label><input id="gym" maxlength="60" placeholder="NOLTO GYM"></div>
    <div><label>Instagram</label><input id="instagram" maxlength="40" placeholder="@handle"></div>
    <div class="full"><label>Phone</label><input id="phone" inputmode="tel" placeholder="010-0000-0000" required></div>
    <div class="full"><label>Player Photo</label><input id="playerPhoto" type="file" accept="image/jpeg,image/png,image/webp" required><div class="hint">GAME #01의 팀 라인업과 FAN PICK에 공개됩니다. 최대 5MB.</div></div>
    <div class="full"><label style="display:flex;gap:8px;align-items:flex-start"><input id="consent" type="checkbox" style="width:auto;margin-top:3px" required><span>ARC GAMES 참가 운영을 위한 이름·연락처·사진 수집 및 선수 카드 공개에 동의합니다.</span></label></div>
    <div class="full"><button id="saveProfileBtn" class="btn arcade-primary entry-wide-btn" type="submit">SAVE & BUILD TEAM →</button><div id="profileMsg" class="notice"></div></div>
  </form>`;
  logoutSetup.onclick=logout; profileForm.onsubmit=saveProfile;
}

async function saveProfile(e){
  e.preventDefault();saveProfileBtn.disabled=true;saveProfileBtn.textContent='SAVING…';
  try{
    const file=playerPhoto.files[0];if(!file)throw new Error('PLAYER PHOTO REQUIRED');
    if(file.size>5*1024*1024)throw new Error('사진은 5MB 이하로 업로드해 주세요.');
    if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('JPG, PNG, WEBP만 업로드할 수 있습니다.');
    const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=`${user.id}/profile.${ext}`;
    const up=await db.storage.from('tg-athlete-photos').upload(path,file,{upsert:true,contentType:file.type});if(up.error)throw up.error;
    const photo_url=db.storage.from('tg-athlete-photos').getPublicUrl(path).data.publicUrl+`?v=${Date.now()}`;
    const a=await db.from('tg_athletes').upsert({id:user.id,display_name:displayName.value.trim(),handle:handle.value.trim(),photo_url,gender:gender.value,division:division.value,gym:gym.value.trim()||null,instagram:instagram.value.trim()||null,profile_public:true},{onConflict:'id'});if(a.error)throw a.error;
    const p=await db.from('tg_athlete_private').upsert({athlete_id:user.id,phone:phone.value.trim(),privacy_consent_at:new Date().toISOString()},{onConflict:'athlete_id'});if(p.error)throw p.error;
    await boot();
  }catch(x){notice('profileMsg',friendly(x),true)}finally{if(document.getElementById('saveProfileBtn')){saveProfileBtn.disabled=false;saveProfileBtn.textContent='SAVE & PICK PARTNER →'}}
}

async function loadHub(){
  currentEvent=await event();
  const [aq,prq,sq,hq,iq,mq,pq,cq]=await Promise.all([
    db.from('tg_athletes').select('*').eq('id',user.id).maybeSingle(),
    db.from('tg_athlete_private').select('phone,privacy_consent_at').eq('athlete_id',user.id).maybeSingle(),
    db.rpc('tg_my_stats',{p_season_slug:'season-2026'}),
    db.rpc('tg_my_history'),
    db.from('tg_team_invites').select('*').eq('event_id',currentEvent.id).order('created_at',{ascending:false}),
    db.from('tg_team_members').select('team_id,athlete_id,member_role').eq('event_id',currentEvent.id).eq('athlete_id',user.id).eq('active',true),
    db.from('tg_athletes').select('id,display_name,handle,photo_url,gym,gender,division').eq('profile_public',true).order('display_name'),
    db.rpc('tg_event_capacity',{p_event_slug:C.eventSlug})
  ]);
  for(const q of [aq,prq,sq,hq,iq,mq,pq,cq])if(q.error)throw q.error;
  me=aq.data;privateData=prq.data||{};myStats=sq.data?.[0]||{leaderboard_rank:'—',total_points:0,starts:0,wins:0,podiums:0};myHistory=hq.data||[];myInvites=iq.data||[];allPlayers=(pq.data||[]).filter(x=>x.id!==user.id);capacityRows=cq.data||[];myTeam=null;myRoster=[];
  if(mq.data?.length){
    const teamId=mq.data[0].team_id;
    const [tq,rq]=await Promise.all([
      db.from('tg_teams').select('id,team_name,heat_no,station_no,status,division,category,payment_status,pricing_tier,amount_due,payment_deadline,depositor_name,payment_reported_at,paid_at').eq('id',teamId).single(),
      db.from('tg_team_members').select('athlete_id,member_role').eq('team_id',teamId).eq('active',true)
    ]);
    if(tq.error)throw tq.error;if(rq.error)throw rq.error;myTeam=tq.data;
    const ids=(rq.data||[]).map(x=>x.athlete_id);if(ids.length){const people=await db.from('tg_athletes').select('id,display_name,handle,photo_url').in('id',ids);if(people.error)throw people.error;myRoster=people.data||[]}
  }
}

function renderHub(){
  authView.style.display='none';onboardView.style.display='none';hubView.style.display='block';
  hubView.innerHTML=`<div class="sectionhead"><div><div class="kicker">PLAYER HUB // PRIVATE</div><h2>${esc(me.display_name)}</h2></div><div class="row-actions"><button id="editProfileBtn" class="btn dark">EDIT PROFILE</button><a class="btn dark" href="player.html?id=${encodeURIComponent(me.id)}">GAME #01 CARD</a><button id="logoutBtn" class="btn dark">LOGOUT</button></div></div>
  <div class="player-grid">
    <div>
      <div class="player-card"><div class="player-card-photo"><img src="${esc(me.photo_url)}" alt="${esc(me.display_name)}"></div><div class="player-card-body"><div class="player-card-rank">PRIVATE PLAYER DATA</div><div class="player-card-name">${esc(me.display_name)}</div><div class="player-card-handle">@${esc(me.handle)}</div><div class="player-card-meta"><span class="player-chip">${esc(me.gender.toUpperCase())}</span><span class="player-chip">${esc(me.division)}</span>${me.gym?`<span class="player-chip">${esc(me.gym)}</span>`:''}</div><div class="player-stats"><div class="player-stat"><span>MY RANK</span><strong>#${myStats.leaderboard_rank}</strong></div><div class="player-stat"><span>PTS</span><strong>${myStats.total_points}</strong></div><div class="player-stat"><span>STARTS</span><strong>${myStats.starts}</strong></div><div class="player-stat"><span>PODIUMS</span><strong>${myStats.podiums}</strong></div></div></div></div>
    </div>
    <div id="gameHub"></div>
  </div>
  <section class="admin-block" style="margin-top:32px"><div class="sectionhead"><div><div class="kicker">PRIVATE RECORD</div><h2>MY GAME LOG</h2></div><p>본인에게만 표시됩니다.</p></div><div class="history-list" id="historyList"></div></section>`;
  editProfileBtn.onclick=showSettings;logoutBtn.onclick=logout;renderGameHub();renderHistory();
}

function showSettings(){
  hubView.innerHTML=`<div class="settings-shell">
    <div class="sectionhead"><div><div class="kicker">PLAYER SETTINGS</div><h2>EDIT PROFILE.</h2></div><button id="closeSettings" class="btn dark">BACK</button></div>
    <div class="settings-current"><img src="${esc(me.photo_url)}" alt="${esc(me.display_name)}"><div><b>${esc(me.display_name)}</b><span>@${esc(me.handle)}</span><small>${esc(user.email||'')}</small></div></div>
    <form id="settingsForm" class="card player-form settings-form">
      <div><label>Player Name</label><input id="setName" maxlength="50" value="${esc(me.display_name)}" required></div>
      <div><label>Player ID</label><input id="setHandle" maxlength="24" pattern="[A-Za-z0-9._-]{2,24}" value="${esc(me.handle)}" required></div>
      <div><label>Gender</label><select id="setGender"><option value="male" ${me.gender==='male'?'selected':''}>MALE</option><option value="female" ${me.gender==='female'?'selected':''}>FEMALE</option></select></div>
      <div><label>Default Division</label><select id="setDivision"><option value="OPEN" ${me.division==='OPEN'?'selected':''}>BEGINNER</option><option value="PRO" ${me.division==='PRO'?'selected':''}>ATHLETE</option></select></div>
      <div><label>Gym / Crew</label><input id="setGym" maxlength="60" value="${esc(me.gym||'')}"></div>
      <div><label>Instagram</label><input id="setInstagram" maxlength="40" value="${esc(me.instagram||'')}"></div>
      <div class="full"><label>Phone</label><input id="setPhone" inputmode="tel" value="${esc(privateData?.phone||'')}" required></div>
      <div class="full"><label>Change Player Photo · Optional</label><input id="setPhoto" type="file" accept="image/jpeg,image/png,image/webp"><div class="hint">사진을 바꾸지 않으려면 비워두면 됩니다. 최대 5MB.</div></div>
      <div class="full settings-divider"></div>
      <div class="full"><label>New Password · Optional</label><input id="setPassword" type="password" minlength="8" maxlength="72" placeholder="변경할 때만 입력"><div class="hint">입력하지 않으면 기존 비밀번호가 유지됩니다.</div></div>
      <div class="full"><button id="saveSettingsBtn" class="btn arcade-primary entry-wide-btn" type="submit">SAVE CHANGES</button><div id="settingsMsg" class="notice"></div></div>
    </form>
  </div>`;
  closeSettings.onclick=renderHub;settingsForm.onsubmit=saveSettings;
}

async function saveSettings(e){
  e.preventDefault();saveSettingsBtn.disabled=true;saveSettingsBtn.textContent='SAVING…';
  try{
    let photo_url=me.photo_url;
    const file=setPhoto.files[0];
    if(file){
      if(file.size>5*1024*1024)throw new Error('사진은 5MB 이하로 업로드해 주세요.');
      if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('JPG, PNG, WEBP만 업로드할 수 있습니다.');
      const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=`${user.id}/profile.${ext}`;
      const up=await db.storage.from('tg-athlete-photos').upload(path,file,{upsert:true,contentType:file.type});if(up.error)throw up.error;
      photo_url=db.storage.from('tg-athlete-photos').getPublicUrl(path).data.publicUrl+`?v=${Date.now()}`;
    }
    const a=await db.from('tg_athletes').update({display_name:setName.value.trim(),handle:setHandle.value.trim(),photo_url,gender:setGender.value,division:setDivision.value,gym:setGym.value.trim()||null,instagram:setInstagram.value.trim()||null}).eq('id',user.id);if(a.error)throw a.error;
    const p=await db.from('tg_athlete_private').upsert({athlete_id:user.id,phone:setPhone.value.trim(),privacy_consent_at:privateData?.privacy_consent_at||new Date().toISOString()},{onConflict:'athlete_id'});if(p.error)throw p.error;
    if(setPassword.value){const pw=await db.auth.updateUser({password:setPassword.value});if(pw.error)throw pw.error}
    await loadHub();renderHub();
  }catch(x){notice('settingsMsg',friendly(x),true)}finally{if(document.getElementById('saveSettingsBtn')){saveSettingsBtn.disabled=false;saveSettingsBtn.textContent='SAVE CHANGES'}}
}

function renderHistory(){
  historyList.innerHTML=myHistory.length?myHistory.map(x=>`<div class="history-row"><div class="mini-avatar"><div class="fallback" style="height:100%;display:grid;place-items:center;color:#777">#${x.place}</div></div><div><div class="row-title">${esc(x.event_title)} · ${esc(x.team_name)}</div><div class="row-sub">WITH ${esc(x.partner_name||'—')} · ${new Date(x.event_date).toLocaleDateString('ko-KR')}</div></div><div class="row-actions"><span class="player-chip">#${x.place}</span><span class="player-chip">${x.points} PTS</span></div></div>`).join(''):'<div class="card muted">아직 공식 경기 기록이 없습니다.</div>';
}

function person(id){return allPlayers.find(x=>x.id===id)||null}
function categoryFor(a,b){return a==='male'&&b==='male'?'MM':a==='female'&&b==='female'?'WW':'MIXED'}
function categoryName(v){return v==='MM'?'MEN / MEN':v==='WW'?'WOMEN / WOMEN':'MIXED'}
function capFor(division,category){return capacityRows.find(x=>x.division===division&&x.category===category)||{filled:0,capacity:4}}
function formatWon(v){return `${Number(v||0).toLocaleString('ko-KR')}원`}
function deadlineText(v){return v?new Date(v).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—'}

function inviteRow(inv,incoming){
  const p=person(incoming?inv.captain_id:inv.invitee_id);
  return `<div class="invite-row"><div class="mini-avatar">${p?.photo_url?`<img src="${esc(p.photo_url)}" alt="">`:''}</div><div><div class="row-title">${esc(inv.team_name)} · ${esc(divisionLabel(inv.division))}</div><div class="row-sub">${esc(p?.display_name||'PLAYER')} · @${esc(p?.handle||'')}</div></div><div class="row-actions">${incoming?`<button class="mini-btn hot" onclick="respondInvite('${inv.id}',true)">ACCEPT</button><button class="mini-btn" onclick="respondInvite('${inv.id}',false)">DECLINE</button>`:`<button class="mini-btn" onclick="cancelInvite('${inv.id}')">CANCEL</button>`}</div></div>`;
}

function bankBox(team){
  return `<div class="bank-transfer-box">
    <div class="bank-transfer-head"><div><span>${team.pricing_tier==='early_bird'?'EARLY BIRD':'REGULAR ENTRY'}</span><strong>${formatWon(team.amount_due)} / TEAM</strong></div><div class="payment-chip">${esc(team.division||'—')} · ${categoryName(team.category)}</div></div>
    <div class="bank-account-row"><span>입금계좌</span><b>${BANK_NAME} ${BANK_ACCOUNT}</b><small>${BANK_HOLDER}</small><button class="mini-btn" type="button" onclick="copyBankAccount()">COPY ACCOUNT</button></div>
    <div class="payment-deadline">자리 HOLD: <b>${deadlineText(team.payment_deadline)}</b>까지 입금 신고</div>
  </div>`;
}

function stopPaymentPoll(){if(paymentPoll){clearInterval(paymentPoll);paymentPoll=null}}
function startPaymentPoll(){
  if(paymentPoll)return;
  paymentPoll=setInterval(async()=>{
    if(document.hidden||!myTeam||myTeam.status!=='pending_payment')return;
    try{
      await loadHub();
      if(myTeam?.status==='confirmed'){
        stopPaymentPoll();
        renderHub();
      }
    }catch(_){}
  },8000);
}

function renderGameHub(){
  if(!myTeam)stopPaymentPoll();
  if(myTeam){
    const mate=myRoster.find(x=>x.id!==user.id);
    if(myTeam.status==='confirmed'){
      stopPaymentPoll();
      gameHub.innerHTML=`<div class="entry-progress-card locked"><div class="entry-progress-label">STEP 05 / 05</div><strong>LOCKED IN</strong></div><div class="team-lock"><div class="kicker">GAME #01 // ENTRY COMPLETE</div><div class="team-lock-top"><div><h3>${esc(myTeam.team_name)}</h3><p class="muted">${esc(me.display_name)} × ${esc(mate?.display_name||'PARTNER')}</p><p class="payment-team-meta">${esc(divisionLabel(myTeam.division))} · ${categoryName(myTeam.category)} · PAID ${formatWon(myTeam.amount_due)}</p></div><div class="slot-display">H${myTeam.heat_no} · S${myTeam.station_no}</div></div></div>`;return;
    }
    if(myTeam.status==='pending_payment'){
      startPaymentPoll();
      const expired=myTeam.payment_status!=='payment_check'&&myTeam.payment_deadline&&new Date(myTeam.payment_deadline)<new Date();
      if(myTeam.payment_status==='payment_check'){
        gameHub.innerHTML=`<div class="entry-progress-card payment-check"><div class="entry-progress-label">STEP 04 / 05</div><strong>PAYMENT CHECK</strong><small>관리자 입금 확인 후 자동으로 LOCKED IN 됩니다.</small></div>${bankBox(myTeam)}<div class="player-panel payment-wait-panel"><div class="kicker">BANK TRANSFER REPORTED</div><h3>입금 확인 중입니다.</h3><p class="muted">입금자명 <b>${esc(myTeam.depositor_name||'—')}</b>으로 신고되었습니다. 운영자가 법인계좌 입금을 확인하면 참가가 최종 확정됩니다.</p></div>`;return;
      }
      if(expired){
        gameHub.innerHTML=`<div class="entry-progress-card expired"><div class="entry-progress-label">STEP 04 / 05</div><strong>HOLD EXPIRED</strong><small>아직 자리가 있다면 다시 24시간을 확보할 수 있습니다.</small></div><div class="player-panel"><div class="kicker">${esc(myTeam.division||'—')} · ${categoryName(myTeam.category)}</div><h3>${esc(myTeam.team_name)}</h3><p class="muted">기존 입금 대기 시간이 만료되었습니다.</p><div class="payment-actions"><button class="btn arcade-primary" onclick="reopenPayment('${myTeam.id}')">REOPEN PAYMENT</button><button class="btn dark" onclick="cancelMyTeam('${myTeam.id}')">CANCEL ENTRY</button></div></div>`;return;
      }
      gameHub.innerHTML=`<div class="entry-progress-card"><div class="entry-progress-label">STEP 04 / 05</div><strong>BANK TRANSFER</strong><small>입금 후 아래에서 입금자명을 제출하세요.</small></div>${bankBox(myTeam)}<div class="player-panel"><div class="kicker">REPORT PAYMENT</div><h3>입금하셨나요?</h3><p class="muted">실제 입금자명을 정확히 입력해 주세요. 관리자 확인 전까지는 최종 참가 확정이 아닙니다.</p><label style="margin-top:16px">Depositor Name</label><input id="depositorName" maxlength="40" placeholder="입금자명"><div class="payment-actions"><button class="btn arcade-primary" onclick="reportPayment('${myTeam.id}')">입금했습니다</button><button class="btn dark" onclick="cancelMyTeam('${myTeam.id}')">CANCEL ENTRY</button></div><div id="paymentMsg" class="notice"></div></div>`;return;
    }
  }
  const incoming=myInvites.filter(x=>x.invitee_id===user.id&&x.status==='pending');const outgoing=myInvites.filter(x=>x.captain_id===user.id&&x.status==='pending');
  gameHub.innerHTML=`<div class="entry-progress-card"><div class="entry-progress-label">STEP 03 / 05</div><strong>BUILD YOUR TEAM</strong><small>팀원 초대를 완료하면 참가비 결제 단계로 넘어갑니다.</small></div><div class="player-panel"><div class="kicker">GAME #01 ENTRY</div><h3>BUILD YOUR TEAM.</h3><p class="muted">BEGINNER / ATHLETE를 선택하고 팀 이름을 정한 뒤 PLAYER를 초대하세요.</p><div style="margin-top:18px"><label>Division</label><select id="teamDivisionInput"><option value="OPEN" ${me.division==='OPEN'?'selected':''}>BEGINNER</option><option value="PRO" ${me.division==='PRO'?'selected':''}>ATHLETE</option></select><div id="capacityStrip" class="capacity-strip"></div><label style="margin-top:12px">Team Name</label><input id="teamNameInput" maxlength="60" placeholder="YOUR TEAM NAME"><label style="margin-top:12px">Find Player</label><input id="playerSearch" type="search" placeholder="이름 / PLAYER ID / GYM"><div id="playerSearchList" class="player-search-list" style="margin-top:10px"></div></div></div><div class="player-panel" style="margin-top:14px"><div class="kicker">INCOMING</div><h3>INVITES</h3><div class="invite-list" id="incomingList"></div></div><div class="player-panel" style="margin-top:14px"><div class="kicker">OUTGOING</div><h3>YOUR INVITE</h3><div class="invite-list" id="outgoingList"></div></div>`;
  teamDivisionInput.onchange=()=>{renderCapacity();renderPlayerSearch()};playerSearch.oninput=renderPlayerSearch;renderCapacity();renderPlayerSearch();incomingList.innerHTML=incoming.map(x=>inviteRow(x,true)).join('')||'<div class="muted">NO INVITES.</div>';outgoingList.innerHTML=outgoing.map(x=>inviteRow(x,false)).join('')||'<div class="muted">NO PENDING INVITE.</div>';
}

function renderCapacity(){
  if(!document.getElementById('capacityStrip'))return;
  const d=teamDivisionInput.value;
  capacityStrip.innerHTML=['MM','WW','MIXED'].map(cat=>{const c=capFor(d,cat);return `<span class="capacity-chip ${Number(c.filled)>=4?'full':''}">${categoryName(cat)} <b>${c.filled}/4</b></span>`}).join('');
}

function renderPlayerSearch(){
  const q=(playerSearch.value||'').trim().toLowerCase();const division=teamDivisionInput.value;
  const list=allPlayers.filter(p=>!q||[p.display_name,p.handle,p.gym].some(v=>String(v||'').toLowerCase().includes(q))).slice(0,8);
  playerSearchList.innerHTML=list.map(p=>{const cat=categoryFor(me.gender,p.gender);const c=capFor(division,cat);const full=Number(c.filled)>=4;return `<div class="player-search-row"><div class="mini-avatar"><img src="${esc(p.photo_url)}" alt=""></div><div><div class="row-title">${esc(p.display_name)}</div><div class="row-sub">@${esc(p.handle)}${p.gym?` · ${esc(p.gym)}`:''} · ${categoryName(cat)} ${c.filled}/4</div></div><div class="row-actions"><button class="mini-btn ${full?'':'hot'}" ${full?'disabled':''} onclick="sendInvite('${p.id}')">${full?'FULL':'INVITE'}</button></div></div>`}).join('')||'<div class="muted">PLAYER NOT FOUND.</div>';
}

window.copyBankAccount=async()=>{try{await navigator.clipboard.writeText(BANK_ACCOUNT);alert('계좌번호를 복사했습니다.')}catch(_){alert(BANK_ACCOUNT)}};
window.reportPayment=async id=>{try{const name=(document.getElementById('depositorName')?.value||'').trim();const r=await db.rpc('tg_report_bank_payment',{p_team_id:id,p_depositor_name:name});if(r.error)throw r.error;await loadHub();renderHub()}catch(e){notice('paymentMsg',friendly(e),true)}};
window.reopenPayment=async id=>{try{const r=await db.rpc('tg_reopen_payment_hold',{p_team_id:id});if(r.error)throw r.error;await loadHub();renderHub()}catch(e){alert(friendly(e))}};
window.cancelMyTeam=async id=>{if(!confirm('이번 TEAM 신청을 취소할까요?'))return;try{const r=await db.rpc('tg_cancel_my_team',{p_team_id:id});if(r.error)throw r.error;await loadHub();renderHub()}catch(e){alert(friendly(e))}};
window.sendInvite=async id=>{try{const name=teamNameInput.value.trim();if(!name)throw new Error('팀 이름을 먼저 입력해 주세요.');const r=await db.rpc('tg_send_team_invite',{p_event_slug:C.eventSlug,p_invitee_id:id,p_team_name:name,p_division:teamDivisionInput.value});if(r.error)throw r.error;await loadHub();renderHub()}catch(e){alert(friendly(e))}};
window.respondInvite=async(id,accept)=>{try{const r=await db.rpc('tg_respond_team_invite',{p_invite_id:id,p_accept:accept});if(r.error)throw r.error;await loadHub();renderHub()}catch(e){alert(friendly(e))}};
window.cancelInvite=async id=>{try{const r=await db.rpc('tg_cancel_team_invite',{p_invite_id:id});if(r.error)throw r.error;await loadHub();renderHub()}catch(e){alert(friendly(e))}};

async function logout(){stopPaymentPoll();await db.auth.signOut();user=null;me=null;privateData=null;showAuth(joinIntent?'signup':'login')}
async function boot(){
  const {data:{user:u}}=await db.auth.getUser();user=u||null;
  if(!user){showAuth(joinIntent?'signup':'login');return}
  const q=await db.from('tg_athletes').select('id').eq('id',user.id).maybeSingle();if(q.error)throw q.error;
  if(!q.data){showOnboarding();return}
  await loadHub();renderHub();
}

boot().catch(e=>showAuth(joinIntent?'signup':'login',friendly(e)));
</script>
</body>
</html>
