<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="ARC STATION PLAYER PROFILE — Complete your athlete information before entering a game.">
  <meta property="og:site_name" content="ARC STATION">
  <meta property="og:title" content="ARC STATION — PLAYER PROFILE">
  <meta property="og:description" content="Complete your PLAYER PROFILE before entering ARC STATION.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://arcstation.kr/player-profile.html">
  <meta property="og:image" content="https://arcstation.kr/station-social.png">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#111111">
  <title>PLAYER PROFILE · ARC STATION</title>
  <link rel="stylesheet" href="styles.css?v=20260919-account1">
  <link rel="stylesheet" href="arcade-pages.css?v=20260928-setup">
<link rel="stylesheet" href="underground.css?v=20260922ug2">
<link rel="stylesheet" href="station.css?v=20260922s2">
<link rel="stylesheet" href="station-navigation.css?v=20260922nav1">
</head>
<body class="tg-arcade-page arc-player-profile-page ug-site station-site">
<div id="nav"></div>

<main>
  <section class="arcade-page-hero arc-player-profile-hero">
    <div class="container arc-player-profile-layout">
      <div>
        <div class="arcade-eyebrow">ARC ACCOUNT // REQUIRED DETAILS</div>
        <h1>COMPLETE<br>YOUR ID.</h1>
        <p class="lead">Complete your account details to continue. Required for all sign-in methods.</p>
        <div class="arcade-page-chips">
          <span>NICKNAME</span><span>NAME</span><span>GENDER</span><span>PHONE</span><span>INSTAGRAM</span><span>GYM</span>
        </div>
      </div>

      <div class="arc-player-form-card">
        <div class="arc-profile-step"><span>01 / PLAYER ID</span><b>REQUIRED TO CONTINUE</b></div>
        <form id="playerProfileForm" class="arc-player-form">
          <label>NICKNAME <em>REQUIRED</em><input id="nickname" minlength="2" maxlength="30" autocomplete="nickname" required></label>
          <label>
            NAME <em>REQUIRED</em>
            <input id="fullName" maxlength="50" autocomplete="name" placeholder="YOUR FULL NAME" required>
          </label>

          <label>
            GENDER <em>REQUIRED</em>
            <select id="gender" required>
              <option value="">SELECT</option>
              <option value="male">MALE</option>
              <option value="female">FEMALE</option>
            </select>
          </label>

          <label>
            PHONE <em>REQUIRED</em>
            <input id="phone" inputmode="numeric" autocomplete="tel" maxlength="13" placeholder="01012345678" required>
          </label>

          <label>
            INSTAGRAM <span>OPTIONAL</span>
            <input id="instagram" maxlength="80" placeholder="@yourhandle">
          </label>

          <label>
            GYM / AFFILIATION <span>OPTIONAL</span>
            <input id="gym" maxlength="80" placeholder="NOLTO GYM">
          </label>

          <label class="arc-consent"><input id="termsConsent" type="checkbox" required><span>I agree to the <a href="terms.html" target="_blank" rel="noopener">Terms of Use</a>.</span></label>
          <label class="arc-consent">
            <input id="privacyConsent" type="checkbox" required>
            <span>I agree to the <a href="privacy.html" target="_blank" rel="noopener">collection and use of my personal data</a> for account and event operations.</span>
          </label>

          <button id="savePlayerProfile" class="btn arcade-primary" type="submit">SAVE & CONTINUE →</button>
          <button id="cancelPlayerProfile" class="btn dark" type="button">LOG OUT</button>
          <div id="profileMsg" class="notice"></div>
        </form>

        <div class="arc-profile-note">
          Your phone number is private and used only for event operations and participant contact.
        </div>
      </div>
    </div>
  </section>
</main>

<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js?v=20261006-partners2"></script>
<script>
shell('PLAYER');

const params=new URLSearchParams(location.search);
const next=safeNextUrl(params.get('next'),'my.html');

function profileError(e){
  const m=String(e?.message||e||'');
  if(m.includes('INVALID_NICKNAME'))return 'Use 2–30 characters for your nickname.';
  if(m.includes('CONSENT_REQUIRED'))return 'Accept the Terms and Privacy Policy to continue.';
  if(m.includes('CATEGORY_GENDER_MISMATCH'))return 'Your gender must match your registered team category. Contact staff for help.';
  if(m.includes('NAME_REQUIRED'))return 'Enter your name.';
  if(m.includes('GENDER_REQUIRED'))return 'Select your gender.';
  if(m.includes('INVALID_PHONE'))return 'Check your mobile number.';
  if(m.includes('PRIVACY_CONSENT_REQUIRED'))return 'Privacy consent is required.';
  if(m.includes('AUTH_REQUIRED'))return 'Please log in.';
  return m||'Could not save your profile.';
}

function digits(v){return String(v||'').replace(/[^0-9]/g,'')}

async function loadProfile(){
  const user=await currentUser();
  if(!user){
    location.href='account.html?mode=login&next='+encodeURIComponent(location.pathname.split('/').pop()+location.search);
    return;
  }

  const boot=await db.rpc('arc_account_bootstrap',{p_display_name:null});
  if(boot.error)throw boot.error;

  const q=await db.rpc('arc_account_setup_state');
  if(q.error)throw q.error;
  const p=q.data||{};
  nickname.value=p.nickname||'';
  termsConsent.checked=!!p.terms_accepted;

  fullName.value=p.full_name||'';
  gender.value=p.gender||user.user_metadata?.gender||'';
  phone.value=p.phone||'';
  instagram.value=p.instagram||'';
  gym.value=p.gym||'';
  privacyConsent.checked=!!p.privacy_accepted;

  if(p.complete){
    notice('profileMsg','PLAYER PROFILE READY. You can edit it anytime.');
  }
}

playerProfileForm.onsubmit=async e=>{
  e.preventDefault();
  savePlayerProfile.disabled=true;
  savePlayerProfile.textContent='SAVING…';

  try{
    const q=await db.rpc('arc_complete_account',{
      p_nickname:nickname.value.trim(),
      p_terms_consent:termsConsent.checked,
      p_full_name:fullName.value.trim(),
      p_gender:gender.value,
      p_phone:digits(phone.value),
      p_instagram:instagram.value.trim()||null,
      p_gym:gym.value.trim()||null,
      p_privacy_consent:privacyConsent.checked
    });
    if(q.error)throw q.error;
    notice('profileMsg','PLAYER PROFILE SAVED.');
    setTimeout(()=>{location.href=next},350);
  }catch(err){
    notice('profileMsg',profileError(err),true);
    savePlayerProfile.disabled=false;
    savePlayerProfile.textContent='SAVE & CONTINUE →';
  }
};

cancelPlayerProfile.onclick=async()=>{await db.auth.signOut();location.href='index.html'};
loadProfile().catch(e=>notice('profileMsg',profileError(e),true));
</script>
</body>
</html>
