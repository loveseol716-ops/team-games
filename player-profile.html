<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="ARC GAMES PLAYER PROFILE — Complete your athlete information before entering a game.">
  <meta property="og:site_name" content="ARC GAMES">
  <meta property="og:title" content="ARC GAMES — PLAYER PROFILE">
  <meta property="og:description" content="Complete your PLAYER PROFILE before entering ARC GAMES.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://arcgames.kr/player-profile.html">
  <meta property="og:image" content="https://arcgames.kr/favicon.png">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#121212">
  <title>PLAYER PROFILE · ARC GAMES</title>
  <link rel="stylesheet" href="styles.css?v=20260919-account1">
  <link rel="stylesheet" href="arcade-pages.css?v=20260919-account1">
<link rel="stylesheet" href="underground.css?v=20260922ug2">
</head>
<body class="tg-arcade-page arc-player-profile-page ug-site">
<div id="nav"></div>

<main>
  <section class="arcade-page-hero arc-player-profile-hero">
    <div class="container arc-player-profile-layout">
      <div>
        <div class="arcade-eyebrow">GAME ENTRY // STEP 01</div>
        <h1>PLAYER<br>PROFILE.</h1>
        <p class="lead">ARC ACCOUNT는 그대로 두고, 실제 대회 참가에 필요한 정보만 한 번 추가합니다.</p>
        <div class="arcade-page-chips">
          <span>NAME</span><span>GENDER</span><span>PHONE</span><span>INSTAGRAM</span><span>GYM</span>
        </div>
      </div>

      <div class="arc-player-form-card">
        <div class="arc-profile-step"><span>01 / PLAYER ID</span><b>REQUIRED BEFORE ENTRY</b></div>
        <form id="playerProfileForm" class="arc-player-form">
          <label>
            NAME <em>REQUIRED</em>
            <input id="fullName" maxlength="50" autocomplete="name" placeholder="홍길동" required>
          </label>

          <label>
            GENDER <em>REQUIRED</em>
            <select id="gender" required>
              <option value="">SELECT</option>
              <option value="male">MALE</option>
              <option value="female">FEMALE</option>
            </select>
          </label>

          <label>
            PHONE <em>REQUIRED</em>
            <input id="phone" inputmode="numeric" autocomplete="tel" maxlength="13" placeholder="01012345678" required>
          </label>

          <label>
            INSTAGRAM <span>OPTIONAL</span>
            <input id="instagram" maxlength="80" placeholder="@yourhandle">
          </label>

          <label>
            GYM / AFFILIATION <span>OPTIONAL</span>
            <input id="gym" maxlength="80" placeholder="NOLTO GYM">
          </label>

          <label class="arc-consent">
            <input id="privacyConsent" type="checkbox" required>
            <span>대회 참가 운영을 위한 개인정보 수집 및 이용에 동의합니다.</span>
          </label>

          <button id="savePlayerProfile" class="btn arcade-primary" type="submit">SAVE PLAYER PROFILE →</button>
          <button id="cancelPlayerProfile" class="btn dark" type="button">BACK</button>
          <div id="profileMsg" class="notice"></div>
        </form>

        <div class="arc-profile-note">
          전화번호는 공개 프로필에 노출되지 않으며, 대회 운영 및 참가자 연락 목적으로만 저장됩니다.
        </div>
      </div>
    </div>
  </section>
</main>

<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js?v=20260922ug1"></script>
<script>
shell('PLAYER');

const params=new URLSearchParams(location.search);
const next=safeNextUrl(params.get('next'),'athlete.html');

function profileError(e){
  const m=String(e?.message||e||'');
  if(m.includes('NAME_REQUIRED'))return '이름을 입력해 주세요.';
  if(m.includes('GENDER_REQUIRED'))return '성별을 선택해 주세요.';
  if(m.includes('INVALID_PHONE'))return '휴대폰 번호를 확인해 주세요.';
  if(m.includes('PRIVACY_CONSENT_REQUIRED'))return '개인정보 수집 및 이용 동의가 필요합니다.';
  if(m.includes('AUTH_REQUIRED'))return '로그인이 필요합니다.';
  return m||'PLAYER PROFILE 저장 중 오류가 발생했습니다.';
}

function digits(v){return String(v||'').replace(/[^0-9]/g,'')}

async function loadProfile(){
  const user=await currentUser();
  if(!user){
    location.href='account.html?mode=login&next='+encodeURIComponent(location.pathname.split('/').pop()+location.search);
    return;
  }

  const boot=await db.rpc('arc_account_bootstrap',{p_display_name:null});
  if(boot.error)throw boot.error;

  const q=await db.rpc('arc_player_profile');
  if(q.error)throw q.error;
  const p=q.data?.[0]||{};

  fullName.value=p.full_name||'';
  gender.value=p.gender||'';
  phone.value=p.phone||'';
  instagram.value=p.instagram||'';
  gym.value=p.gym||'';
  privacyConsent.checked=!!p.privacy_consent_at;

  if(p.profile_complete){
    notice('profileMsg','PLAYER PROFILE READY. 필요한 경우 수정 후 저장할 수 있습니다.');
  }
}

playerProfileForm.onsubmit=async e=>{
  e.preventDefault();
  savePlayerProfile.disabled=true;
  savePlayerProfile.textContent='SAVING…';

  try{
    const q=await db.rpc('arc_save_player_profile',{
      p_full_name:fullName.value.trim(),
      p_gender:gender.value,
      p_phone:digits(phone.value),
      p_instagram:instagram.value.trim()||null,
      p_gym:gym.value.trim()||null,
      p_privacy_consent:privacyConsent.checked
    });
    if(q.error)throw q.error;
    notice('profileMsg','PLAYER PROFILE SAVED.');
    setTimeout(()=>{location.href=next},350);
  }catch(err){
    notice('profileMsg',profileError(err),true);
    savePlayerProfile.disabled=false;
    savePlayerProfile.textContent='SAVE PLAYER PROFILE →';
  }
};

cancelPlayerProfile.onclick=()=>{location.href=next};
loadProfile().catch(e=>notice('profileMsg',profileError(e),true));
</script>
</body>
</html>
