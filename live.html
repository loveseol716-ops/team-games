<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIVE · TEAM GAMES</title><link rel="stylesheet" href="styles.css"></head><body><div id="nav"></div><main><section class="section"><div class="container"><div class="sectionhead"><div><div class="kicker">LIVE</div><h2>LEADERBOARD</h2></div><p>경기 당일 실시간 기록.</p></div><div class="card"><table><thead><tr><th>RANK</th><th>TEAM</th><th>HEAT</th><th>TIME</th><th>REPS</th><th>STATUS</th></tr></thead><tbody id="lb"></tbody></table></div></div></section></main><div id="footer"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>shell("LIVE");async function render(){const ts=await teams(),ev=await event(),r=await db.from('tg_results').select('*').eq('event_id',ev.id);if(r.error)throw r.error;const m={};r.data.forEach(x=>m[x.team_id]=x);lb.innerHTML=ts.map(t=>{const x=m[t.id]||{};const tm=x.finish_seconds!=null?`${Math.floor(x.finish_seconds/60)}:${String(Math.floor(x.finish_seconds%60)).padStart(2,'0')}`:'—';return `<tr><td>${x.rank||'—'}</td><td>${t.team_name}</td><td>${t.heat_no}</td><td>${tm}</td><td>${x.reps_completed??'—'}</td><td>${x.status||'Not Started'}</td></tr>`}).join('')}render();setInterval(render,5000);</script></body></html>
