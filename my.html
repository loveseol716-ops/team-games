<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="ARC GAMES MY PAGE — Manage your ARC ID, manage PLAY POINT and prepare for upcoming games.">
  <meta property="og:site_name" content="ARC GAMES">
  <meta property="og:title" content="ARC GAMES — ACCOUNT">
  <meta property="og:description" content="Create your ARC ID and get ready for GAME #01.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://arcgames.kr/my.html">
  <meta property="og:image" content="https://arcgames.kr/favicon.png">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#050508">
  <title>MY PAGE · ARC GAMES</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="arcade-pages.css?v=20260918-7">
</head>
<body class="tg-arcade-page arc-my-page">
<div id="nav"></div>
<main>
  <section class="arcade-page-hero arc-my-hero">
    <div class="container">
      <div class="arcade-eyebrow">ARC ACCOUNT // PLAYER TERMINAL</div>
      <h1>MY<br>PAGE.</h1>
      <p class="lead">ARC ID, PLAY POINT, 참가 준비 상태를 한 곳에서 관리합니다.</p>
    </div>
  </section>

  <section class="section arcade-deck-section">
    <div class="container">
      <div id="myPageState" class="arc-my-grid"><div class="card muted">LOADING ARC ID...</div></div>
    </div>
  </section>
</main>
<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
shell('ACCOUNT');

const fmtP=v=>Number(v||0).toLocaleString('en-US')+' P';
const signed=v=>(Number(v||0)>0?'+':'')+Number(v||0).toLocaleString('en-US')+' P';

async function loadMy(){
  const user=await currentUser();
  if(!user){location.href='account.html?mode=login&next=my.html';return}
  const boot=await db.rpc('arc_account_bootstrap',{p_display_name:null});
  if(boot.error)throw boot.error;
  const q=await db.rpc('arc_my_account');
  if(q.error)throw q.error;
  renderMy(q.data?.[0]);
}

function renderMy(a){
  if(!a){myPageState.innerHTML='<div class="card notice err" style="display:block">ACCOUNT LOAD FAILED.</div>';return}
  myPageState.innerHTML=`
    <article class="arc-id-card">
      <span>ARC ID</span>
      <h2>${esc(a.display_name)}</h2>
      <p>${esc(a.email)}</p>
      <div class="arc-id-status"><i></i> ACCOUNT ACTIVE</div>
    </article>

    <article class="arc-wallet-card">
      <span>PLAY POINT WALLET</span>
      <h2>${fmtP(a.balance)}</h2>
      <div class="arc-stat-row"><div><span>TOTAL BET</span><b>${fmtP(a.total_staked)}</b></div><div><span>WINS</span><b>${a.wins||0} / ${a.settled_bets||0}</b></div></div>
      <div class="arc-stat-row"><div><span>HIT RATE</span><b>${Number(a.hit_rate||0).toFixed(1)}%</b></div><div><span>NET WIN</span><b>${signed(a.net_win)}</b></div></div>
    </article>

    <article class="arc-access-card">
      <span>GAME ACCESS</span>
      <h3>${a.athlete_ready?'PLAYER PROFILE READY':'PLAYER PROFILE NOT SET'}</h3>
      <p>참가신청 오픈 시 추가 선수 프로필을 입력한 뒤 팀을 만들 수 있습니다.</p>
      <div class="arc-access-list"><div><b>FAN PICK</b><span>LOGIN READY</span></div><div><b>GAME ENTRY</b><span>COMING SOON</span></div></div>
    </article>

    <article class="arc-settings-card">
      <span>ACCOUNT SETTINGS</span>
      <label>NICKNAME<input id="editNickname" maxlength="30" value="${esc(a.display_name)}"></label>
      <button id="saveNickname" class="btn arcade-primary" type="button">SAVE NICKNAME</button>
      <button id="logoutAccount" class="btn dark" type="button">LOGOUT</button>
      <div id="settingsMsg" class="notice"></div>
    </article>
  `;

  saveNickname.onclick=async()=>{
    const name=editNickname.value.trim();
    if(!name){notice('settingsMsg','닉네임을 입력해 주세요.',true);return}
    saveNickname.disabled=true;
    const q=await db.rpc('arc_update_profile',{p_display_name:name});
    if(q.error){notice('settingsMsg',q.error.message,true);saveNickname.disabled=false;return}
    notice('settingsMsg','NICKNAME UPDATED.');
    await loadMy();
  };
  logoutAccount.onclick=async()=>{await db.auth.signOut();location.href='index.html'};
}
loadMy().catch(e=>{myPageState.innerHTML=`<div class="card notice err" style="display:block">${esc(e.message||e)}</div>`});
</script>
</body>
</html>
