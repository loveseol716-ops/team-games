<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="ARC STATION ACCOUNT — Create your ARC ID, manage PLAY POINT and prepare for upcoming games.">
  <meta property="og:site_name" content="ARC STATION">
  <meta property="og:title" content="ARC STATION — ACCOUNT">
  <meta property="og:description" content="Create your ARC ID and get ready for PROJECT #1 NOLTO.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://arcstation.kr/account.html">
  <meta property="og:image" content="https://arcstation.kr/station-social.png">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#111111">
  <title>ACCOUNT · ARC STATION</title>
  <link rel="stylesheet" href="styles.css?v=20260919-account1">
  <link rel="stylesheet" href="arcade-pages.css?v=20260919-account1">
<link rel="stylesheet" href="underground.css?v=20260922ug2">
<link rel="stylesheet" href="station.css?v=20260922s2">
<link rel="stylesheet" href="station-navigation.css?v=20260922nav1">
</head>
<body class="tg-arcade-page arc-account-page ug-site station-site">
<div id="nav"></div>
<main>
  <section class="arcade-page-hero arc-account-hero">
    <div class="container arc-account-layout">
      <div class="arc-account-copy">
        <div class="arcade-eyebrow">ARC ACCOUNT / YOUR WAY IN</div>
        <h1>JOIN<br>THE FLOOR.</h1>
        <p class="lead">Your ARC account gets you into the game and FAN PICK.</p>
        <div class="arcade-page-chips"><span>ENTER GAME</span><span>FAN PICK</span><span>PLAY POINT</span><span>MY PAGE</span></div>
      </div>
      <div class="arc-auth-shell">
        <div class="arc-auth-tabs">
          <button id="signupTab" class="btn arcade-primary" type="button">SIGN UP</button>
          <button id="loginTab" class="btn dark" type="button">LOG IN</button>
        </div>
        <div class="arc-social-login">
          <div class="arc-social-title"><span></span><b>QUICK LOGIN</b><span></span></div>
          <div class="arc-social-grid">
            <button class="arc-social-btn social-google" type="button" data-provider="google"><i>G</i><span>GOOGLE</span></button>
            <button class="arc-social-btn social-kakao" type="button" data-provider="kakao"><i>K</i><span>KAKAO</span></button>
          </div>
          <div id="socialMsg" class="notice"></div>
        </div>
        <div class="arc-auth-divider"><span>OR EMAIL</span></div>
        <div id="authCard"></div>
      </div>
    </div>
  </section>
</main>
<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js?v=20260922nav1"></script>
<script>
shell('ACCOUNT');

const params=new URLSearchParams(location.search);
const storedNext=safeNextUrl(sessionStorage.getItem('arc_oauth_next'),'my.html');
const next=safeNextUrl(params.get('next')||sessionStorage.getItem('arc_oauth_next'),'my.html');
let mode=params.get('mode')==='login'?'login':'signup';
let emailSubmitting=false;

const byId=id=>document.getElementById(id);
const signupTab=byId('signupTab');
const loginTab=byId('loginTab');
const authCard=byId('authCard');

function authError(e){
  const m=String(e?.message||e||'');
  if(m.includes('EMAIL_EXISTS')||m.toLowerCase().includes('already registered'))return 'This email is already registered. Log in instead.';
  if(m.includes('INVALID_EMAIL'))return 'Check your email address.';
  if(m.includes('INVALID_PASSWORD'))return 'Use at least 8 characters, including a letter and a number.';
  if(m.includes('INVALID_NAME'))return 'Enter a name with at least 2 characters.';
  if(m.includes('INVALID_NICKNAME'))return 'Use 2–30 characters for your nickname.';
  if(m.includes('INVALID_PHONE'))return 'Check your mobile number.';
  if(m.includes('CONSENT_REQUIRED'))return 'Accept the Terms and Privacy Policy to continue.';
  if(m.includes('Invalid login credentials'))return 'Email or password is incorrect.';
  if(m.includes('Unsupported provider')||m.includes('provider is not enabled')||m.includes('not enabled'))return 'This sign-in option is not available yet.';
  if(m.includes('ORIGIN_NOT_ALLOWED'))return 'Sign-up is unavailable on this domain.';
  return m||'Something went wrong. Please try again.';
}

function renderAuth(){
  signupTab.className='btn '+(mode==='signup'?'arcade-primary':'dark');
  loginTab.className='btn '+(mode==='login'?'arcade-primary':'dark');

  authCard.innerHTML=`
    <div class="arc-auth-status"><span>${mode==='signup'?'NEW PLAYER':'RETURNING PLAYER'}</span><b>${mode==='signup'?'10,000 P WELCOME CREDIT':'ACCESS YOUR ARC ID'}</b></div>
    <form id="arcAuthForm" class="arc-auth-form">
      ${mode==='signup'?`<div class="arc-auth-field-grid">
        <label>NICKNAME <em>REQUIRED</em><input id="nickname" minlength="2" maxlength="30" autocomplete="nickname" placeholder="NAME SHOWN ON SITE" required></label>
        <label>NAME <em>REQUIRED</em><input id="fullName" minlength="2" maxlength="50" autocomplete="name" placeholder="LEGAL NAME" required></label>
      </div>
      <label>MOBILE <em>REQUIRED</em><input id="phone" type="tel" inputmode="tel" maxlength="20" autocomplete="tel" placeholder="010-1234-5678" required></label>`:''}
      <label>EMAIL<input id="email" type="email" autocomplete="email" required></label>
      <label>PASSWORD<input id="password" type="password" minlength="8" maxlength="72" autocomplete="${mode==='signup'?'new-password':'current-password'}" required></label>
      ${mode==='signup'?`<label>CONFIRM PASSWORD<input id="passwordConfirm" type="password" minlength="8" maxlength="72" autocomplete="new-password" required></label>
      <p class="arc-password-hint">Use at least 8 characters with a letter and a number.</p>
      <div class="arc-signup-consents">
        <label><input id="termsConsent" type="checkbox" required><span><b>[REQUIRED]</b> <a href="terms.html" target="_blank" rel="noopener">TERMS OF USE</a> — I AGREE.</span></label>
        <label><input id="privacyConsent" type="checkbox" required><span><b>[REQUIRED]</b> <a href="privacy.html" target="_blank" rel="noopener">DATA COLLECTION & USE</a> — I AGREE.</span></label>
        <label><input id="marketingConsent" type="checkbox"><span>[OPTIONAL] I agree to receive event and service updates.</span></label>
      </div>`:''}
      <input id="website" class="arc-hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button id="submitAuth" class="btn arcade-primary" type="submit">${mode==='signup'?'CREATE ARC ACCOUNT →':'LOGIN →'}</button>
      <div id="authMsg" class="notice"></div>
    </form>
    <div class="arc-auth-note">Create an ARC account and receive 10,000 free PLAY POINT for FAN PICK.</div>`;

  byId('arcAuthForm').onsubmit=submitEmail;
}

async function finishLogin(name=null){
  const boot=await db.rpc('arc_account_bootstrap',{p_display_name:name});
  if(boot.error)throw boot.error;
  sessionStorage.removeItem('arc_oauth_next');
  location.href=next;
}

async function submitEmail(e){
  e.preventDefault();
  emailSubmitting=true;
  const submitBtn=byId('submitAuth');
  submitBtn.disabled=true;
  submitBtn.textContent='LOADING…';

  try{
    const mail=byId('email').value.trim().toLowerCase();
    const pw=byId('password').value;
    let name=null;

    if(mode==='signup'){
      name=byId('nickname').value.trim();
      const fullName=byId('fullName').value.trim();
      const phone=byId('phone').value.trim();
      const pwConfirm=byId('passwordConfirm').value;
      if(name.length<2)throw new Error('INVALID_NICKNAME');
      if(fullName.length<2)throw new Error('INVALID_NAME');
      if(!/^\d{8,15}$/.test(phone.replace(/\D/g,'')))throw new Error('INVALID_PHONE');
      if(!/^(?=.*[A-Za-z])(?=.*\d).{8,72}$/.test(pw))throw new Error('INVALID_PASSWORD');
      if(pw!==pwConfirm)throw new Error('Passwords do not match.');
      if(!byId('termsConsent').checked||!byId('privacyConsent').checked)throw new Error('CONSENT_REQUIRED');
      const r=await db.functions.invoke('tg-athlete-signup',{body:{
        email:mail,password:pw,display_name:name,full_name:fullName,phone,
        terms_consent:true,privacy_consent:true,marketing_consent:byId('marketingConsent').checked,
        website:byId('website').value
      }});
      if(r.error){
        let serverError='';
        try{serverError=(await r.error.context?.json())?.error||''}catch(_ignored){}
        throw new Error(serverError||r.error.message);
      }
      if(!r.data?.ok)throw new Error(r.data?.error||'SIGNUP_FAILED');
    }

    const login=await db.auth.signInWithPassword({email:mail,password:pw});
    if(login.error)throw login.error;
    await finishLogin(name);
  }catch(err){
    emailSubmitting=false;
    notice('authMsg',authError(err),true);
    submitBtn.disabled=false;
    submitBtn.textContent=mode==='signup'?'CREATE ARC ACCOUNT →':'LOGIN →';
  }
}

async function socialLogin(provider,button){
  button.disabled=true;
  const original=button.innerHTML;
  button.innerHTML='<span>CONNECTING…</span>';

  try{
    sessionStorage.setItem('arc_oauth_next',next);
    const {error}=await db.auth.signInWithOAuth({
      provider,
      options:{redirectTo:location.origin+'/account.html'}
    });
    if(error)throw error;
  }catch(err){
    sessionStorage.removeItem('arc_oauth_next');
    notice('socialMsg',authError(err),true);
    button.disabled=false;
    button.innerHTML=original;
  }
}

document.querySelectorAll('.arc-social-btn').forEach(btn=>{
  btn.addEventListener('click',()=>socialLogin(btn.dataset.provider,btn));
});

signupTab.onclick=()=>{mode='signup';renderAuth()};
loginTab.onclick=()=>{mode='login';renderAuth()};

let finishing=false;
async function handleExistingSession(){
  if(finishing||emailSubmitting)return;
  const user=await currentUser();
  if(!user)return;
  finishing=true;
  try{
    await finishLogin(null);
  }catch(e){
    finishing=false;
    notice('socialMsg',authError(e),true);
  }
}

db.auth.onAuthStateChange((event,session)=>{
  if(session?.user&&(event==='SIGNED_IN'||event==='INITIAL_SESSION'))handleExistingSession();
});

renderAuth();
setTimeout(handleExistingSession,150);
</script>
</body>
</html>
