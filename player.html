<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PLAYER · ARC GAMES</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="athlete.css">
  <link rel="stylesheet" href="arcade-pages.css">
</head>
<body class="tg-arcade-page public-player-arcade">
<div id="nav"></div>
<main>
  <section class="section player-shell arcade-deck-section">
    <div class="container">
      <div id="profile"><div class="card muted">LOADING PLAYER…</div></div>
    </div>
  </section>
</main>
<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
shell('TEAMS');

async function init(){
  const id=new URLSearchParams(location.search).get('id');
  if(!id){profile.innerHTML='<div class="card notice err" style="display:block">PLAYER NOT FOUND.</div>';return}
  try{
    const ev=await event();
    const {data:a,error}=await db.from('tg_athletes').select('id,display_name,handle,photo_url,gym,instagram,gender,division').eq('id',id).single();
    if(error)throw error;

    const {data:members,error:merr}=await db.from('tg_team_members').select('team_id,athlete_id').eq('event_id',ev.id).eq('athlete_id',id).eq('active',true);
    if(merr)throw merr;

    let gameBlock=`<div class="player-panel"><div class="kicker">GAME #01</div><h3>NOT LOCKED IN.</h3><p class="muted">아직 이번 GAME의 팀이 확정되지 않았습니다.</p></div>`;

    if(members?.length){
      const teamId=members[0].team_id;
      const [{data:t,error:te},{data:roster,error:re}]=await Promise.all([
        db.from('tg_teams').select('id,team_name,heat_no,station_no,status').eq('id',teamId).single(),
        db.from('tg_team_members').select('athlete_id').eq('team_id',teamId).eq('active',true)
      ]);
      if(te)throw te;if(re)throw re;
      const rosterIds=(roster||[]).map(x=>x.athlete_id);
      let rosterNames=[a.display_name];
      if(rosterIds.length){
        const q=await db.from('tg_athletes').select('id,display_name').in('id',rosterIds);
        if(q.error)throw q.error;
        const byId=Object.fromEntries((q.data||[]).map(x=>[x.id,x.display_name]));
        rosterNames=rosterIds.map(x=>byId[x]).filter(Boolean);
      }
      gameBlock=`
        <div class="team-lock">
          <div class="kicker">GAME #01 // LOCKED IN</div>
          <div class="team-lock-top">
            <div><h3>${esc(t.team_name)}</h3><p class="muted">${esc(rosterNames.join(' × ')||a.display_name)}</p></div>
            <div class="slot-display">H${t.heat_no} · S${t.station_no}</div>
          </div>
        </div>`;
    }

    profile.innerHTML=`
      <div class="public-player-head">
        <div class="public-player-photo"><img src="${esc(a.photo_url)}" alt="${esc(a.display_name)}"></div>
        <div class="public-player-copy">
          <div class="arcade-eyebrow">PLAYER CARD // GAME #01</div>
          <h1>${esc(a.display_name)}</h1>
          <div class="handle">@${esc(a.handle)}</div>
          <div class="player-card-meta">
            <span class="player-chip">${esc(a.gender.toUpperCase())}</span>
            <span class="player-chip">${esc(divisionLabel(a.division))}</span>
            ${a.gym?`<span class="player-chip">${esc(a.gym)}</span>`:''}
            ${a.instagram?`<a class="player-chip" href="https://instagram.com/${encodeURIComponent(a.instagram.replace('@',''))}" target="_blank" rel="noopener">${esc(a.instagram)}</a>`:''}
          </div>
        </div>
      </div>
      <section class="admin-block" style="margin-top:36px">
        <div class="sectionhead"><div><div class="kicker">CURRENT GAME</div><h2>GAME #01</h2></div><p>OCT 31, 2026 · TEAM OF 3</p></div>
        ${gameBlock}
      </section>`;
  }catch(e){profile.innerHTML=`<div class="card notice err" style="display:block">${esc(e.message)}</div>`}
}
init();
</script>
</body>
</html>
