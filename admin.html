<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GAME MASTER · TEAM GAMES</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="nav"></div>
<main>
  <section class="section admin-section">
    <div class="container">
      <div class="sectionhead admin-head">
        <div>
          <div class="kicker">GAME MASTER</div>
          <h2>CONTROL ROOM</h2>
        </div>
        <div id="sessionTools" class="admin-session" style="display:none">
          <span id="sessionEmail" class="muted"></span>
          <button id="logoutBtn" class="btn dark" type="button">EXIT</button>
        </div>
      </div>

      <div id="loginBox" class="card admin-login">
        <div class="admin-login-copy">
          <div class="kicker">INSERT COIN</div>
          <div class="big">GAME MASTER LOGIN</div>
          <p class="muted">운영자만 입장 가능.</p>
        </div>
        <div class="formgrid">
          <div class="full"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="loveseol716@gmail.com"></div>
          <div class="full"><label>Password</label><input id="pass" type="password" autocomplete="current-password"></div>
          <div class="full">
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <button id="login" class="btn arcade-primary" type="button">PRESS START</button>
              <button id="forgotPassword" class="btn dark" type="button">FORGOT PASSWORD</button>
            </div>
            <div id="adminMsg" class="notice"></div>
          </div>
        </div>
      </div>

      <div id="resetBox" class="card admin-login" style="display:none">
        <div class="admin-login-copy">
          <div class="kicker">NEW PASSWORD</div>
          <div class="big">RESET GAME MASTER KEY</div>
          <p class="muted">새 비밀번호를 8자 이상 입력하세요.</p>
        </div>
        <div class="formgrid">
          <div class="full"><label>New Password</label><input id="newPass" type="password" minlength="8" maxlength="72" autocomplete="new-password"></div>
          <div class="full"><label>Confirm Password</label><input id="newPassConfirm" type="password" minlength="8" maxlength="72" autocomplete="new-password"></div>
          <div class="full"><button id="saveNewPassword" class="btn arcade-primary" type="button">SAVE NEW PASSWORD</button><div id="resetMsg" class="notice"></div></div>
        </div>
      </div>

      <div id="control" style="display:none">
        <div id="summary" class="admin-summary"></div>

        <section class="admin-block">
          <div class="admin-block-head">
            <div>
              <div class="kicker">ROSTER</div>
              <h3>PLAYER SELECT</h3>
            </div>
            <div class="admin-filters">
              <input id="teamSearch" type="search" placeholder="팀명 / 선수 / 연락처 검색">
              <select id="statusFilter">
                <option value="all">ALL TEAMS</option>
                <option value="confirmed">LOCKED IN</option>
                <option value="cancelled">OUT</option>
              </select>
            </div>
          </div>
          <div id="teamAdminMsg" class="notice"></div>
          <div id="adminTeams" class="admin-team-grid"></div>
        </section>

        <section class="admin-block">
          <div class="admin-block-head">
            <div>
              <div class="kicker">SCOREBOARD</div>
              <h3>SCORE INPUT</h3>
            </div>
            <p class="muted">LOCKED IN 팀만 표시.</p>
          </div>
          <div class="card admin-results-wrap">
            <div class="table-scroll">
              <table>
                <thead><tr><th>TEAM</th><th>SLOT</th><th>TIME</th><th>REPS</th><th>GAME STATUS</th><th></th></tr></thead>
                <tbody id="resultRows"></tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </div>
  </section>
</main>
<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
shell("ADMIN");

let allAdminTeams=[];
let currentEvent=null;

const fmtPhone=v=>String(v||'').replace(/\s+/g,' ').trim();
const statusLabel=s=>s==='confirmed'?'LOCKED IN':'OUT';

function adminError(x){
  const m=String(x?.message||x||'');
  if(m.includes('ADMIN_ONLY')) return 'GAME MASTER 권한이 없는 계정입니다.';
  if(m.includes('Invalid login credentials')) return '이메일 또는 비밀번호가 맞지 않습니다.';
  if(m.includes('Email rate limit exceeded')) return '재설정 메일 요청이 너무 많습니다. 잠시 뒤 다시 시도해 주세요.';
  if(m.includes('DUPLICATE_PHONE')) return '다른 활성 팀에서 이미 사용 중인 연락처입니다.';
  if(m.includes('SLOT_TAKEN')||m.includes('tg_teams_confirmed_slot_unique')) return '해당 Heat / Station은 이미 사용 중입니다.';
  if(m.includes('INVALID_HEAT')) return 'Heat는 1~6 사이로 설정해 주세요.';
  if(m.includes('INVALID_STATION')) return 'Station은 1 또는 2만 가능합니다.';
  return m || '처리 중 오류가 발생했습니다.';
}

async function adminTeams(){
  const q=await db.rpc('tg_admin_list_teams',{p_event_slug:C.eventSlug});
  if(q.error) throw q.error;
  return q.data||[];
}

async function enterAdmin(){
  try{
    currentEvent=await event();
    allAdminTeams=await adminTeams();
    const {data:{user}}=await db.auth.getUser();
    loginBox.style.display='none';
    resetBox.style.display='none';
    control.style.display='block';
    sessionTools.style.display='flex';
    sessionEmail.textContent=user?.email||'GAME MASTER';
    renderSummary();
    renderTeamManagement();
    await loadResults();
  }catch(e){
    control.style.display='none';
    sessionTools.style.display='none';
    loginBox.style.display='block';
    notice('adminMsg',adminError(e),true);
  }
}

function renderSummary(){
  const approved=allAdminTeams.filter(t=>t.status==='confirmed').length;
  const cancelled=allAdminTeams.filter(t=>t.status==='cancelled').length;
  const max=currentEvent?.max_teams||12;
  summary.innerHTML=`
    <div class="admin-stat"><span>LOCKED IN</span><strong>${approved}</strong><small>/ ${max} TEAMS</small></div>
    <div class="admin-stat"><span>OUT</span><strong>${cancelled}</strong><small>TEAMS</small></div>
    <div class="admin-stat"><span>EMPTY SLOTS</span><strong>${Math.max(0,max-approved)}</strong><small>LEFT</small></div>
    <div class="admin-stat"><span>ENTRY</span><strong class="admin-stat-word ${currentEvent?.registration_open?'is-open':'is-closed'}">${currentEvent?.registration_open?'OPEN':'CLOSED'}</strong><small>STAGE 01</small></div>`;
}

function renderTeamManagement(){
  const q=teamSearch.value.trim().toLowerCase();
  const sf=statusFilter.value;
  const list=allAdminTeams.filter(t=>{
    if(sf!=='all'&&t.status!==sf) return false;
    if(!q) return true;
    return [t.team_name,t.player_1,t.player_2,t.phone].some(v=>String(v||'').toLowerCase().includes(q));
  });

  if(!list.length){
    adminTeamsEl().innerHTML=`<div class="card admin-empty">NO PLAYERS FOUND.</div>`;
    return;
  }

  adminTeamsEl().innerHTML=list.map(t=>`
    <article class="admin-team-card ${t.status==='cancelled'?'is-cancelled':''}" data-team="${t.id}">
      <div class="admin-team-photo">
        ${t.photo_url?`<img src="${esc(t.photo_url)}" alt="${esc(t.team_name)}">`:'<div class="admin-photo-empty">NO PHOTO</div>'}
        <div class="admin-status-badge ${t.status==='confirmed'?'approved':'cancelled'}">${statusLabel(t.status)}</div>
      </div>
      <div class="admin-team-body">
        <div class="admin-team-title-row">
          <div>
            <div class="entry-label">TEAM</div>
            <h4>${esc(t.team_name)}</h4>
          </div>
          <div class="admin-slot-mini">H${t.heat_no} · S${t.station_no}</div>
        </div>
        <div class="admin-contact"><a href="tel:${esc(fmtPhone(t.phone))}">${esc(fmtPhone(t.phone))}</a></div>
        <div class="admin-edit-grid">
          <div class="full"><label>Team Name</label><input id="team-${t.id}" value="${esc(t.team_name)}" maxlength="60"></div>
          <div><label>Player 1</label><input id="p1-${t.id}" value="${esc(t.player_1)}" maxlength="50"></div>
          <div><label>Player 2</label><input id="p2-${t.id}" value="${esc(t.player_2)}" maxlength="50"></div>
          <div class="full"><label>Contact</label><input id="phone-${t.id}" value="${esc(t.phone)}" inputmode="tel"></div>
          <div><label>Heat</label><input id="heat-${t.id}" type="number" min="1" max="6" value="${t.heat_no}"></div>
          <div><label>Station</label><select id="station-${t.id}"><option value="1" ${t.station_no===1?'selected':''}>1</option><option value="2" ${t.station_no===2?'selected':''}>2</option></select></div>
          <div class="full"><label>Roster Status</label><select id="teamstatus-${t.id}"><option value="confirmed" ${t.status==='confirmed'?'selected':''}>LOCKED IN</option><option value="cancelled" ${t.status==='cancelled'?'selected':''}>OUT</option></select></div>
        </div>
        <div class="admin-team-actions">
          ${t.photo_url?`<a class="btn dark" href="${esc(t.photo_url)}" target="_blank" rel="noopener">OPEN PHOTO</a>`:''}
          <button class="btn arcade-primary" type="button" onclick="saveTeam('${t.id}')">SAVE SLOT</button>
        </div>
      </div>
    </article>`).join('');
}

function adminTeamsEl(){return document.getElementById('adminTeams')}

window.saveTeam=async id=>{
  const btn=document.querySelector(`[data-team="${id}"] .admin-team-actions button`);
  const original=btn?.textContent||'SAVE SLOT';
  try{
    if(btn){btn.disabled=true;btn.textContent='SAVING…'}
    const args={
      p_team_id:id,
      p_team_name:document.getElementById(`team-${id}`).value.trim(),
      p_player_1:document.getElementById(`p1-${id}`).value.trim(),
      p_player_2:document.getElementById(`p2-${id}`).value.trim(),
      p_phone:document.getElementById(`phone-${id}`).value.trim(),
      p_heat_no:Number(document.getElementById(`heat-${id}`).value),
      p_station_no:Number(document.getElementById(`station-${id}`).value),
      p_status:document.getElementById(`teamstatus-${id}`).value
    };
    const r=await db.rpc('tg_admin_update_team',args);
    if(r.error) throw r.error;
    notice('teamAdminMsg','SLOT SAVED.');
    allAdminTeams=await adminTeams();
    renderSummary();
    renderTeamManagement();
    await loadResults();
  }catch(e){
    notice('teamAdminMsg',adminError(e),true);
  }finally{
    if(btn){btn.disabled=false;btn.textContent=original}
  }
};

async function loadResults(){
  const approved=allAdminTeams.filter(t=>t.status==='confirmed');
  const r=await db.from('tg_results').select('*').eq('event_id',currentEvent.id);
  if(r.error) throw r.error;
  const map={};(r.data||[]).forEach(x=>map[x.team_id]=x);
  resultRows.innerHTML=approved.map(t=>{
    const x=map[t.id]||{};
    const tm=x.finish_seconds!=null?`${Math.floor(x.finish_seconds/60)}:${String(Math.floor(x.finish_seconds%60)).padStart(2,'0')}`:'';
    return `<tr>
      <td><strong>${esc(t.team_name)}</strong><div class="table-sub">${esc(t.player_1)} × ${esc(t.player_2)}</div></td>
      <td>H${t.heat_no} · S${t.station_no}</td>
      <td><input id="time-${t.id}" value="${tm}" placeholder="07:42"></td>
      <td><input id="reps-${t.id}" type="number" value="${x.reps_completed??''}"></td>
      <td><select id="status-${t.id}"><option ${x.status==='Not Started'?'selected':''}>Not Started</option><option ${x.status==='Running'?'selected':''}>Running</option><option ${x.status==='Finished'?'selected':''}>Finished</option><option ${x.status==='Time Cap'?'selected':''}>Time Cap</option></select></td>
      <td><button class="btn dark" type="button" onclick="saveResult('${t.id}')">SAVE SCORE</button></td>
    </tr>`;
  }).join('') || '<tr><td colspan="6" class="muted">NO LOCKED-IN TEAMS.</td></tr>';
}

window.saveResult=async id=>{
  try{
    const v=document.getElementById(`time-${id}`).value.trim();
    const p=v?v.split(':').map(Number):[];
    const sec=p.length===2?p[0]*60+p[1]:null;
    const reps=document.getElementById(`reps-${id}`).value;
    const status=document.getElementById(`status-${id}`).value;
    const r=await db.from('tg_results').upsert({event_id:currentEvent.id,team_id:id,finish_seconds:sec,reps_completed:reps?Number(reps):null,status,updated_at:new Date().toISOString()},{onConflict:'event_id,team_id'});
    if(r.error) throw r.error;
    await rank(currentEvent.id);
    await loadResults();
  }catch(e){alert(adminError(e))}
};

async function rank(eventId){
  const q=await db.from('tg_results').select('id,status,finish_seconds,reps_completed').eq('event_id',eventId);
  if(q.error) throw q.error;
  const a=(q.data||[]).filter(x=>['Finished','Time Cap'].includes(x.status)).sort((x,y)=>{
    if(x.status!==y.status)return x.status==='Finished'?-1:1;
    return x.status==='Finished'?(x.finish_seconds??99999)-(y.finish_seconds??99999):(y.reps_completed??-1)-(x.reps_completed??-1)
  });
  for(let i=0;i<a.length;i++){
    const u=await db.from('tg_results').update({rank:i+1}).eq('id',a[i].id);
    if(u.error) throw u.error;
  }
}

login.onclick=async()=>{
  if(!email.value.trim()||!pass.value){notice('adminMsg','이메일과 비밀번호를 입력해 주세요.',true);return}
  login.disabled=true;
  login.textContent='CHECKING…';
  notice('adminMsg','로그인 확인 중…');
  try{
    const {error}=await db.auth.signInWithPassword({email:email.value.trim(),password:pass.value});
    if(error) throw error;
    notice('adminMsg','GAME MASTER 확인 완료.');
    await enterAdmin();
  }catch(e){notice('adminMsg',adminError(e),true)}
  finally{login.disabled=false;login.textContent='PRESS START'}
};

forgotPassword.onclick=async()=>{
  const target=email.value.trim()||'loveseol716@gmail.com';
  email.value=target;
  forgotPassword.disabled=true;
  forgotPassword.textContent='SENDING…';
  notice('adminMsg','비밀번호 재설정 메일을 보내는 중…');
  try{
    const redirectTo=`${location.origin}${location.pathname}?reset=1`;
    const {error}=await db.auth.resetPasswordForEmail(target,{redirectTo});
    if(error)throw error;
    notice('adminMsg',`${target} 로 재설정 메일을 보냈습니다. 메일의 링크를 눌러 새 비밀번호를 설정하세요.`);
  }catch(e){notice('adminMsg',adminError(e),true)}
  finally{forgotPassword.disabled=false;forgotPassword.textContent='FORGOT PASSWORD'}
};

saveNewPassword.onclick=async()=>{
  const a=newPass.value,b=newPassConfirm.value;
  if(a.length<8){notice('resetMsg','비밀번호는 8자 이상이어야 합니다.',true);return}
  if(a!==b){notice('resetMsg','두 비밀번호가 일치하지 않습니다.',true);return}
  saveNewPassword.disabled=true;
  saveNewPassword.textContent='SAVING…';
  try{
    const {error}=await db.auth.updateUser({password:a});
    if(error)throw error;
    notice('resetMsg','비밀번호가 변경되었습니다. CONTROL ROOM으로 이동합니다.');
    history.replaceState({},'',location.pathname);
    await enterAdmin();
  }catch(e){notice('resetMsg',adminError(e),true)}
  finally{saveNewPassword.disabled=false;saveNewPassword.textContent='SAVE NEW PASSWORD'}
};

logoutBtn.onclick=async()=>{await db.auth.signOut();location.reload()};
teamSearch.oninput=renderTeamManagement;
statusFilter.onchange=renderTeamManagement;
pass.addEventListener('keydown',e=>{if(e.key==='Enter')login.click()});

(async()=>{
  const isReset=new URLSearchParams(location.search).get('reset')==='1';
  const {data:{session}}=await db.auth.getSession();
  if(isReset&&session){
    loginBox.style.display='none';
    resetBox.style.display='block';
    return;
  }
  if(session) await enterAdmin();
})();
</script>
</body>
</html>
