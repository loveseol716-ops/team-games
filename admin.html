<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN · TEAM GAMES</title><link rel="stylesheet" href="styles.css"></head><body><div id="nav"></div><main><section class="section"><div class="container"><div class="sectionhead"><div><div class="kicker">ADMIN</div><h2>EVENT CONTROL</h2></div></div><div id="loginBox" class="card formgrid"><div class="full"><label>Email</label><input id="email" type="email"></div><div class="full"><label>Password</label><input id="pass" type="password"></div><div class="full"><button id="login" class="btn">LOGIN</button><div id="adminMsg" class="notice"></div></div></div><div id="control" style="display:none"><div class="card"><table><thead><tr><th>TEAM</th><th>TIME</th><th>REPS</th><th>STATUS</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></div></section></main><div id="footer"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>shell("ADMIN");login.onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:email.value,password:pass.value});if(error)return notice('adminMsg',error.message,true);loginBox.style.display='none';control.style.display='block';load()};async function load(){const ts=await teams(),ev=await event(),r=await db.from('tg_results').select('*').eq('event_id',ev.id),m={};(r.data||[]).forEach(x=>m[x.team_id]=x);rows.innerHTML=ts.map(t=>{const x=m[t.id]||{};const tm=x.finish_seconds!=null?`${Math.floor(x.finish_seconds/60)}:${String(Math.floor(x.finish_seconds%60)).padStart(2,'0')}`:'';return `<tr><td>${t.team_name}</td><td><input id="time-${t.id}" value="${tm}" placeholder="07:42"></td><td><input id="reps-${t.id}" type="number" value="${x.reps_completed??''}"></td><td><select id="status-${t.id}"><option>Not Started</option><option>Running</option><option>Finished</option><option>Time Cap</option></select></td><td><button class="btn dark" onclick="save('${t.id}')">SAVE</button></td></tr>`}).join('')}window.save=async id=>{try{const ev=await event(),v=document.getElementById(`time-${id}`).value.trim(),p=v?v.split(':').map(Number):[],sec=p.length===2?p[0]*60+p[1]:null,reps=document.getElementById(`reps-${id}`).value,status=document.getElementById(`status-${id}`).value;const r=await db.from('tg_results').upsert({event_id:ev.id,team_id:id,finish_seconds:sec,reps_completed:reps?Number(reps):null,status,updated_at:new Date().toISOString()},{onConflict:'event_id,team_id'});if(r.error)throw r.error;await rank(ev.id);load()}catch(e){alert(e.message)}};async function rank(eventId){const q=await db.from('tg_results').select('id,status,finish_seconds,reps_completed').eq('event_id',eventId);if(q.error)throw q.error;const a=q.data.filter(x=>['Finished','Time Cap'].includes(x.status)).sort((x,y)=>{if(x.status!==y.status)return x.status==='Finished'?-1:1;return x.status==='Finished'?(x.finish_seconds??99999)-(y.finish_seconds??99999):(y.reps_completed??-1)-(x.reps_completed??-1)});for(let i=0;i<a.length;i++){const u=await db.from('tg_results').update({rank:i+1}).eq('id',a[i].id);if(u.error)throw u.error}}</script></body></html>
