<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RANKING · TEAM GAMES</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="athlete.css">
</head>
<body>
<div id="nav"></div>
<main>
  <section class="player-hero">
    <div class="container">
      <div class="arcade-eyebrow">2026 SEASON // PLAYER RANKING</div>
      <h1>CLIMB<br>THE BOARD.</h1>
      <p class="lead">팀은 매 게임 바뀔 수 있다. 점수는 선수에게 남는다.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="sectionhead">
        <div><div class="kicker">SEASON BOARD</div><h2>PLAYER RANKING</h2></div>
        <p>공식 경기 결과만 포인트에 반영됩니다.</p>
      </div>
      <div id="board" class="rank-board"><div class="card muted">LOADING PLAYERS…</div></div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="sectionhead">
        <div><div class="kicker">POINT SYSTEM</div><h2>EVERY PLACE COUNTS.</h2></div>
        <p>TEAM 결과가 두 선수에게 동일하게 적립됩니다.</p>
      </div>
      <div class="points-rule-grid">
        <div class="points-rule"><span>1ST</span><b>100</b></div><div class="points-rule"><span>2ND</span><b>80</b></div>
        <div class="points-rule"><span>3RD</span><b>65</b></div><div class="points-rule"><span>4TH</span><b>55</b></div>
        <div class="points-rule"><span>5TH</span><b>50</b></div><div class="points-rule"><span>6TH</span><b>45</b></div>
        <div class="points-rule"><span>7TH</span><b>40</b></div><div class="points-rule"><span>8TH</span><b>35</b></div>
        <div class="points-rule"><span>9TH</span><b>30</b></div><div class="points-rule"><span>10TH</span><b>25</b></div>
        <div class="points-rule"><span>11TH</span><b>20</b></div><div class="points-rule"><span>12TH</span><b>15</b></div>
      </div>
    </div>
  </section>
</main>
<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
shell('RANKING');

async function init(){
  try{
    const list=await leaderboard();
    if(!list.length){
      board.innerHTML='<div class="card"><div class="kicker">NO SCORE YET</div><h3>FIRST POINTS DROP AFTER GAME #01.</h3><p class="muted">선수 프로필을 만들면 시즌 보드에 이름이 올라갑니다.</p><a class="btn arcade-primary" href="athlete.html">CREATE PLAYER</a></div>';
      return;
    }
    board.innerHTML=list.map(x=>`
      <a class="rank-row ${Number(x.leaderboard_rank)<=3?'top3':''}" href="player.html?id=${encodeURIComponent(x.athlete_id)}">
        <div class="rank-no">#${String(x.leaderboard_rank).padStart(2,'0')}</div>
        <div class="rank-avatar"><img src="${esc(x.photo_url)}" alt="${esc(x.display_name)}"></div>
        <div class="rank-name"><strong>${esc(x.display_name)}</strong><small>@${esc(x.handle)}${x.gym?` · ${esc(x.gym)}`:''}</small></div>
        <div class="rank-metric rank-points"><span>PTS</span><b>${x.total_points}</b></div>
        <div class="rank-metric"><span>STARTS</span><b>${x.starts}</b></div>
        <div class="rank-metric"><span>WINS</span><b>${x.wins}</b></div>
        <div class="rank-metric"><span>PODIUMS</span><b>${x.podiums}</b></div>
      </a>`).join('');
  }catch(e){board.innerHTML=`<div class="card notice err" style="display:block">${esc(e.message)}</div>`}
}
init();
</script>
</body>
</html>
